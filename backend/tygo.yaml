# TypeScript wire types generated from the Go structs that cross the HTTP
# boundary. Regenerate with, from this directory:
#
#   go run github.com/gzuidhof/tygo@v0.2.21 generate
#
# backend.yml's "Build, vet, and unit tests" job reruns exactly that and diffs
# the result, so a Go wire struct that changes without its TypeScript is a
# failing required check rather than a runtime surprise in the browser.
#
# TWO OUTPUT FILES, ON PURPOSE. tygo writes one file per package and does not
# merge: give two packages the same output_path and the second silently
# CLOBBERS the first — exit 0, no warning, 33 interfaces reduced to 1. So
# internal/models and internal/truth each get their own file.
type_mappings:
  # Without this, time.Time falls through to fallback_type. `unknown` would pass
  # eslint and then break `tsc -b` at every consumer that reads a date field as
  # a string; encoding/json marshals time.Time as an RFC3339 string, so `string`
  # is what is actually on the wire.
  time.Time: "string"

packages:
  - path: "github.com/thinkbig1979/capstan/backend/internal/models"
    output_path: "../frontend/src/types/generated.ts"
    # queryfilters.go holds handler-internal query shapes with no json tags at
    # all; they never reach a response body. Generating them would publish Go
    # field names as if they were a JSON contract.
    exclude_files:
      - "queryfilters.go"
    # `any` is an eslint error here (@typescript-eslint/no-explicit-any, set to
    # error by tseslint.configs.recommended in frontend/eslint.config.js), and
    # generated files are linted with the rest of the corpus. `unknown` forces
    # the consumer to narrow instead of silently widening.
    fallback_type: "unknown"
    preserve_comments: "default"
    frontmatter: |
      /**
       * Generated by tygo v0.2.21 from backend/internal/models. DO NOT EDIT.
       * Regenerate: cd backend && go run github.com/gzuidhof/tygo@v0.2.21 generate
       */

  - path: "github.com/thinkbig1979/capstan/backend/internal/truth"
    output_path: "../frontend/src/types/generated-truth.ts"
    # enum_style: union turns the Outcome constants into a real literal union
    # (`typeof OutcomeSuccess | ...`), so `const o: Outcome = 'nonsense'` is a
    # TS2322. Under the default "const" style Outcome is just `string` and that
    # same line compiles clean — the whole point of generating it is lost.
    # image_inspect.go's only exported type is ImageInspector, a Go interface
    # naming the subset of the Docker client this package needs. It is not a
    # wire shape, and tygo renders a Go interface as the fallback type, so
    # including it publishes `export type ImageInspector = unknown` to the
    # frontend for no reason.
    exclude_files:
      - "image_inspect.go"
    # enum_style: union turns the Outcome constants into a real literal union
    # (`typeof OutcomeSuccess | ...`), so `const o: Outcome = 'nonsense'` is a
    # TS2322. Under the default "const" style Outcome is just `string` and that
    # same line compiles clean — the whole point of generating it is lost.
    enum_style: "union"
    fallback_type: "unknown"
    preserve_comments: "default"
    frontmatter: |
      /**
       * Generated by tygo v0.2.21 from backend/internal/truth. DO NOT EDIT.
       * Regenerate: cd backend && go run github.com/gzuidhof/tygo@v0.2.21 generate
       */
