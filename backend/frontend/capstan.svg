<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Capstan">
  <title>Capstan</title>
  <!-- Adaptive: follows the browser/OS colour scheme. Transparent background. -->
  <style>
    .ring { stroke: #0d8a8a; }
    .bar  { fill: #0f3a4d; }
    .hub  { fill: #0f3a4d; }
    .knob { fill: #d9a441; stroke: #0f3a4d; stroke-width: 1.4; }
    .dot  { fill: #d9a441; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #2bb8b8; }
      .bar  { fill: #e9e2d0; }
      .hub  { fill: #e9e2d0; }
      .knob { fill: #d9a441; stroke: none; }
    }
  </style>
  <defs>
    <g id="bar">
      <rect class="bar" x="47.6" y="7" width="4.8" height="33" rx="2.4"/>
      <circle class="knob" cx="50" cy="7.5" r="4"/>
    </g>
  </defs>
  <circle class="ring" cx="50" cy="50" r="25" fill="none" stroke-width="3" stroke-dasharray="3 4.5"/>
  <use href="#bar" transform="rotate(0 50 50)"/>
  <use href="#bar" transform="rotate(45 50 50)"/>
  <use href="#bar" transform="rotate(90 50 50)"/>
  <use href="#bar" transform="rotate(135 50 50)"/>
  <use href="#bar" transform="rotate(180 50 50)"/>
  <use href="#bar" transform="rotate(225 50 50)"/>
  <use href="#bar" transform="rotate(270 50 50)"/>
  <use href="#bar" transform="rotate(315 50 50)"/>
  <circle class="hub" cx="50" cy="50" r="15"/>
  <circle class="dot" cx="50" cy="50" r="6"/>
</svg>
