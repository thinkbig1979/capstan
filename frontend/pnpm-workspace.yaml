allowBuilds:
  core-js: false
  esbuild: false
  msgpackr-extract: false
  msw: false
ignoredBuiltDependencies:
  - msw
# Security: delay installs until releases have had time to be vetted, and
# refuse to silently accept packages whose trust signals weaken on update.
minimumReleaseAge: 10080
# `minimumReleaseAgeExclude` is deliberately absent. It carried one entry,
# fast-uri@3.1.5, added on 2026-08-03 because that fix was inside the 7-day
# window while `pnpm audit` at high and above is a required status check, so
# the quarantine was holding main closed to every merge (agent-os-eld). That
# entry carried its own expiry — "REMOVE after 2026-08-07 09:16 UTC, when
# 3.1.5 clears the window on its own and this entry becomes a no-op" — and it
# was removed on 2026-08-08 once it had. VERIFIED before removing, not after:
# with the entry deleted, `pnpm install --frozen-lockfile` exits 0, fast-uri
# still resolves to 3.1.5, and `pnpm audit --prod --audit-level=high` exits 0.
#
# Keep it absent. An exclusion is a hole in the maturity floor, and the floor
# matters most for exactly the brand-new packages an exclusion would admit.
# The bar for adding one back is a required check that is red RIGHT NOW with
# no other way through, and whatever is added carries an exact version and a
# removal date the way that one did.
trustPolicy: no-downgrade
# Security: these exact versions were traced and confirmed legitimate on
# 2026-07-21 (publisher/provenance change, not a takeover) — excluded from
# the no-downgrade check so installs aren't blocked on known-good releases.
trustPolicyExclude:
  - '@effect/platform-node-shared@4.0.0-beta.70'
  - effect@4.0.0-beta.70
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1
# Security: advisories that `pnpm audit` reports but that have been assessed as
# not applicable here. Every entry needs a written reason and an issue that
# removes it — an allowlist without an expiry date becomes a place findings go
# to be forgotten. Suppression is visible, not silent: pnpm still lists the
# finding and appends "(N ignored)" to the severity line.
#
# This is what .github/workflows/security.yml gates on, so an entry added here
# silences CI as well as local audits. That is the intent — one place to state
# the exception, one place to review it — but it is also why the bar for adding
# one is a reachability argument, not an inconvenience.
#
# GHSA-qwww-vcr4-c8h2 (react-router RSC Mode CSRF bypass) previously lived here
# while react-router-dom had no patched release. Cleared by migrating off
# react-router-dom onto react-router 8.3.0 (agent-os-e0t) — no entries remain.
auditConfig:
  ignoreGhsas: []

# Security: dev-scope disposition (agent-os-l78, 2026-08-03), not entered
# above because nothing here is a production finding to allowlist — see
# "why no entries" at the end. `pnpm audit --audit-level=moderate --json`
# reported 20 advisories on 2026-08-03 and reports 1 today after the overrides
# below (agent-os-ziz); none was production-reachable then or now (the Dockerfile
# build copies only `vite build`'s dist/ output; none of these packages are
# imported by app code). security.yml's frontend-audit job already treats
# dev-dependency advisories as advisory-only for this reason, in its "Full
# advisories including dev dependencies" step. They fall into two chains:
#
# 1. minimatch, ajv, flatted, js-yaml, brace-expansion — transitive through
#    @typescript-eslint/eslint-plugin > ... > eslint, the lint toolchain
#    every PR runs. `react-doctor` (devDependency, kept per the agent-os-3g7
#    decision) bundles its own `eslint-plugin-react-hooks` and so resolves a
#    second copy of the same eslint chain, and some of these advisories list
#    a `react-doctor` path alongside it — but checked via `pnpm audit
#    --audit-level=moderate --json` on 2026-08-03, every one of them also has
#    20+ paths through the direct eslint devDependency with no react-doctor
#    in them. Pinning or removing react-doctor would not clear these.
#
#    CORRECTED 2026-08-08 (agent-os-ziz). This paragraph used to end "the fix
#    is an eslint-toolchain bump, which will land on its own schedule as
#    upstream releases one", and an adjacent line said none of these was
#    "actionable from this repo without forcing resolutions that break the
#    toolchain". Both were wrong, and neither had been executed — waiting on
#    upstream was not a measured conclusion, it was an assumption that read
#    like one. OBSERVED: every one of these five resolves to a patched version
#    already past the maturity floor, and the `overrides:` block below now
#    pins them. `pnpm install` succeeds and eslint, `tsc -b`, `vite build` and
#    the full vitest suite (89 files, 881 tests) all pass. Frontend went from
#    12 HIGH advisories to 1. Only nanoid remains, and only because its fix is
#    younger than the 7-day floor — see the note in the overrides block.
#
# 2. undici — transitive through jsdom > vitest, the test runner's DOM
#    implementation. `pnpm why undici` shows only jsdom/vitest paths; not
#    reachable from react-doctor or any other package. vitest never runs in
#    the built image.
#
# Why no entries in ignoreGhsas above: that list is for a *production*
# finding assessed as unreachable despite `pnpm audit --prod` flagging it.
# Everything here is already excluded from that gate by being a dev
# dependency; adding it to ignoreGhsas would silence a signal
# (`pnpm audit --audit-level=moderate`, the non-gating advisory step) that is
# supposed to stay visible so a sudden jump is noticeable, per that step's
# own comment in security.yml.
overrides:
  # Security: pull fast-uri past the path-traversal fix and past the three host
  # confusion advisories, GHSA-4c8g-83qw-93j6 (fixed 3.1.3),
  # GHSA-v2hh-gcrm-f6hx (fixed 3.1.4) and GHSA-7p8r-x3mc-p8w7 (fixed 3.1.5).
  # Reached only via composerize > composeverter > ajv, which declares
  # fast-uri ^3.0.1 and so resolves to a vulnerable 3.1.x on its own.
  # Removable once ajv's own floor moves past 3.1.5.
  #
  # The selector must stay one step ahead of the floor it enforces. This read
  # `fast-uri@<3.1.4: '>=3.1.4 <4'`, which stopped matching the moment
  # resolution landed ON 3.1.4 — so when GHSA-7p8r-x3mc-p8w7 raised the bar to
  # 3.1.5, the override was already a silent no-op and `pnpm audit` failed
  # (agent-os-eld). Bump BOTH sides together, never just the target.
  #
  # Capped below 4 on purpose: ajv asks for ^3.0.1, so handing it the 4.x major
  # would be an untested API change rather than a security fix.
  #
  # Lives here (not package.json "pnpm.overrides") because pnpm 10.16+/11 reads
  # overrides from pnpm-workspace.yaml.
  fast-uri@<3.1.5: '>=3.1.5 <4'

  # Security: the dev-toolchain advisory batch (agent-os-ziz, 2026-08-08).
  #
  # These six sit in transitive dependencies of the lint, build and test
  # toolchain — eslint, vite, postcss, vitest. Five are DoS / ReDoS /
  # prototype-pollution; postcss GHSA-fxqj-rqcc-2cmp is NOT — it is an
  # attacker-controlled `sourceMappingURL` reading arbitrary .map files when
  # `from` is unset, i.e. a file-read on the build machine. ajv and postcss are
  # MODERATE; the other four families are HIGH. None is reachable at runtime:
  # the Dockerfile's frontend-build stage runs `vite build` and copies only
  # dist/, so none of these packages exists in the shipped image.
  # `pnpm audit --prod --audit-level=high`, the required status check, was
  # green BEFORE this block and is green after it — it was never at risk, and
  # nothing here was ever gating a merge.
  #
  # THE EARLIER "NOT ACTIONABLE" REASONING WAS WRONG. The dev-scope note ABOVE
  # this `overrides:` block said "None is actionable from this repo without
  # forcing resolutions that break the toolchain" and concluded the fix was an
  # upstream eslint-toolchain bump landing on its own schedule. That was
  # asserted, not measured. OBSERVED 2026-08-08: every one of these resolves to
  # a patched version already past the 7-day maturity floor, `pnpm install`
  # succeeds, and eslint, tsc -b, vite build and the full vitest suite (89
  # files, 881 tests) all pass. Frontend went from 16 advisories (12 HIGH, 4
  # moderate) to 1.
  #
  # WHAT MOVED THE VERSIONS WAS THE LOCKFILE RE-RESOLUTION, NOT THESE
  # SELECTORS, and the first draft of this comment got that backwards.
  # MEASURED 2026-08-08, two fresh `pnpm install --lockfile-only` runs from no
  # lockfile, differing only in whether this block is present: minimatch,
  # flatted, brace-expansion, js-yaml, ajv, postcss and nanoid resolve to
  # IDENTICAL versions either way, and `pnpm audit` reports the same single
  # nanoid finding either way. The stale lockfile had been pinning old
  # versions; re-resolving un-pinned them.
  #
  # THAT IS NOT AN ARGUMENT FOR DELETING THIS BLOCK — it is the argument for
  # keeping it. Today's resolution is patched only because a caret range floats
  # to the newest mature version and that happens to be above the advisory
  # floor. These selectors are what hold it there, and they are DORMANT BY
  # DESIGN: a floor that never fires is a floor doing its job. VERIFIED
  # two-sided on the same instrument, with a package demanding the vulnerable
  # minimatch 3.1.2 — WITH `minimatch@<3.1.4` resolution is rescued to 3.1.5;
  # WITHOUT it, resolution stays on 3.1.2. Do not read "it changes nothing
  # today" as "it does nothing".
  #
  # The lockfile diff also floated minimatch 10.2.5 -> 10.2.6. No selector here
  # touches 10.x — that is incidental re-resolution, not this block.
  #
  # SUPERSEDED IN PART, 2026-08-08, by eslint 9.39.2 -> 10.8.0 (PR #154). The
  # paragraph above used to argue from "@eslint/eslintrc@3.3.3, the copy in this
  # tree, still declares `minimatch: ^3.1.2`, `ajv: ^6.12.4` and
  # `js-yaml: ^4.1.1`". That premise is now FALSE and the sentence is removed
  # rather than left to mislead: eslint 10 drops @eslint/eslintrc entirely.
  # OBSERVED on merged main at 4bc78cc — `pnpm why @eslint/eslintrc` returns
  # nothing and the lockfile holds 0 entries for it. The conclusion (keep the
  # block) survives; the reason it rested on does not.
  #
  # DISPOSITION AFTER ESLINT 10, decided per package against what is actually in
  # the tree rather than in aggregate. The rule applied: a selector whose
  # package left the tree ENTIRELY is dead config and goes; a selector whose
  # package still resolves through some parent stays as a dormant floor.
  #
  #   js-yaml   GONE from the tree entirely — zero lockfile entries. Its only
  #             parent was eslint's config loading via @eslint/eslintrc. DELETED
  #             below; this is the one selector eslint 10 actually killed.
  #   ajv       6.15.0 STAYS in the tree, and its parent changed rather than
  #             disappeared: `pnpm why ajv` now shows eslint@10.8.0 declaring
  #             the 6.x copy directly instead of reaching it through eslintrc.
  #             eslint 10 declares `ajv: ^6.14.0`, which is exactly this
  #             selector's floor, so upstream now agrees with it. Kept: upstream
  #             agreement is a fact about one release, not a guarantee.
  #   minimatch only 10.2.6 remains; the 3.x chain is gone with eslintrc. The
  #             PACKAGE still resolves (via @eslint/config-array), so the
  #             selector is kept as the guard against a 3.x range returning. It
  #             cannot touch the 10.x copy — the range forbids it.
  #   brace-expansion  only 5.0.9 remains, via minimatch 10.2.6. The `<1.1.18`
  #             selector's 1.x chain is gone for the same reason as minimatch
  #             3.x; both selectors kept on the same reasoning.
  #   flatted   3.4.4 STAYS, via flat-cache > file-entry-cache > eslint@10.8.0.
  #             Unaffected by the major. Kept.
  #   postcss   8.5.25 STAYS, via vite. Never touched eslint. Kept.
  #   fast-uri  3.1.5 STAYS, via ajv@8.20.0 — and that path is PRODUCTION
  #             (@hookform/resolvers and composerize > composeverter are runtime
  #             dependencies), not dev-scope like the rest of this block. Kept,
  #             and it is the one selector here that is not dev-only.
  #
  # Each selector is capped inside its current major on purpose — these are
  # security floors for packages this repo does not use directly, not upgrades.
  # As with fast-uri above: when an advisory raises the bar, bump BOTH sides of
  # the selector, never just the target, or the override silently becomes a
  # no-op the moment resolution lands on the old floor.
  #
  # GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj (ReDoS, <3.1.3) and
  # GHSA-23c5-xmqv-rm74 (extglob ReDoS, <3.1.4). Reached via eslint and via
  # rimraf/glob under the test toolchain. The 10.x copies in the tree are
  # unaffected; this selector cannot touch them.
  minimatch@<3.1.4: '>=3.1.4 <4'
  # GHSA-25h7-pfq9-p65f (unbounded recursion in parse(), <3.4.0) and
  # GHSA-rf6f-7fwh-wjgh (prototype pollution via parse(), <=3.4.1). Reached
  # only via eslint's cache serialization (flat-cache > flatted).
  flatted@<3.4.2: '>=3.4.2 <4'
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895 (three
  # DoS-by-expansion findings). Two live copies at different majors, so two
  # selectors: the 1.x chain reached via minimatch, and the 5.x chain reached
  # via the newer glob. 5.0.9 is the patched floor for the >=4.0.0 range.
  brace-expansion@<1.1.18: '>=1.1.18 <2'
  brace-expansion@>=4.0.0 <5.0.9: '>=5.0.9 <6'
  # js-yaml@>=4.0.0 <4.3.1 was here, covering GHSA-52cp-r559-cp3m (quadratic CPU
  # via YAML merge-key chains) and GHSA-5p4m-2wfm-xmqj (quadratic CPU in !!omap
  # resolution). REMOVED 2026-08-08 (agent-os-724): js-yaml reached this tree
  # only through eslint's config loading via @eslint/eslintrc, and eslint 10.8.0
  # drops @eslint/eslintrc. js-yaml is now absent from the tree entirely — zero
  # lockfile entries — so the selector had nothing left to match and was dead
  # config rather than a dormant floor. Restore it, with both advisory IDs, if
  # js-yaml ever re-enters the dependency graph.
  # GHSA-2g4f-4pwh-qvx6. The 6.x copy is declared directly by eslint@10.8.0
  # (before eslint 10 it was reached via eslint > @eslint/eslintrc); the
  # separate 8.x copy under composerize and @hookform/resolvers is not affected.
  # Capped below 7 because eslint asks for ^6.14.0 and 7.x/8.x are API breaks,
  # not fixes.
  ajv@<6.14.0: '>=6.14.0 <7'
  # GHSA-fxqj-rqcc-2cmp. Reached via vite (both @tailwindcss/vite and
  # @vitejs/plugin-react pull it). Note this does NOT clear postcss's own
  # nanoid dependency — see the nanoid note below.
  postcss@<8.5.23: '>=8.5.23 <9'
  # Security: nanoid GHSA-2v37-7h3g-55p8 — custom generators can loop forever
  # when size is non-positive. Reached only via vite > postcss > nanoid (5
  # paths), so dev-toolchain scope like the six above: the Dockerfile's
  # frontend-build stage runs `vite build` and copies only dist/, and nanoid
  # is absent from the shipped image.
  #
  # THE FLOOR MOVED WHILE THIS WAS DEFERRED, SO THE VERSION THAT USED TO BE
  # WRITTEN HERE IS NOW WRONG. This slot held a "NOT FIXED" note (agent-os-ziz,
  # 2026-08-08) saying the fix was nanoid 3.3.17, published 2026-08-03T10:39Z
  # and inside the 7-day `minimumReleaseAge` window until 2026-08-10T10:39Z, so
  # an override to it failed the install with ERR_PNPM_NO_MATURE_MATCHING_VERSION.
  # It instructed a later editor to add `nanoid@<3.3.17: '>=3.3.17 <4'` on or
  # after 2026-08-10. Do NOT restore that selector — the advisory has since
  # raised its own bar and 3.3.17 is vulnerable too. OBSERVED 2026-08-20 from
  # `pnpm audit --audit-level=moderate` in this tree: "Vulnerable versions
  # <3.3.18 / Patched versions >=3.3.18". The fix is 3.3.18, published
  # 2026-08-07T16:41Z, which cleared the floor on 2026-08-14 (agent-os-bvi).
  #
  # Rejected then and still rejected: a `minimumReleaseAgeExclude` entry to
  # force an immature version — the floor cleared on its own, so there is
  # nothing to punch a hole for. nanoid 5.x is still the wrong answer too, an
  # ESM-only major that postcss does not ask for (postcss/lib/input.js does
  # `require('nanoid/non-secure')`), i.e. an untested API swap, not a fix.
  #
  # DORMANT on arrival, like the six above: postcss declares `nanoid: ^3.3.16`,
  # which floats to a patched 3.x without help. This line is what stops it
  # dropping BACK below 3.3.18. When an advisory raises the bar again, bump
  # BOTH sides of the selector — the stale 3.3.17 instruction replaced here is
  # exactly the debris a one-sided bump leaves behind.
  nanoid@<3.3.18: '>=3.3.18 <4'
