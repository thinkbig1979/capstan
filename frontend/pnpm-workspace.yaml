allowBuilds:
  core-js: false
  esbuild: false
  msgpackr-extract: false
  msw: false
ignoredBuiltDependencies:
  - msw
# Security: delay installs until releases have had time to be vetted, and
# refuse to silently accept packages whose trust signals weaken on update.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Security: these exact versions were traced and confirmed legitimate on
# 2026-07-21 (publisher/provenance change, not a takeover) — excluded from
# the no-downgrade check so installs aren't blocked on known-good releases.
trustPolicyExclude:
  - '@effect/platform-node-shared@4.0.0-beta.70'
  - effect@4.0.0-beta.70
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1
# Security: advisories that `pnpm audit` reports but that have been assessed as
# not applicable here. Every entry needs a written reason and an issue that
# removes it — an allowlist without an expiry date becomes a place findings go
# to be forgotten. Suppression is visible, not silent: pnpm still lists the
# finding and appends "(N ignored)" to the severity line.
#
# This is what .github/workflows/security.yml gates on, so an entry added here
# silences CI as well as local audits. That is the intent — one place to state
# the exception, one place to review it — but it is also why the bar for adding
# one is a reachability argument, not an inconvenience.
#
# GHSA-qwww-vcr4-c8h2 (react-router RSC Mode CSRF bypass) previously lived here
# while react-router-dom had no patched release. Cleared by migrating off
# react-router-dom onto react-router 8.3.0 (agent-os-e0t) — no entries remain.
auditConfig:
  ignoreGhsas: []

# Security: dev-scope disposition (agent-os-l78, 2026-08-03), not entered
# above because nothing here is a production finding to allowlist — see
# "why no entries" at the end. `pnpm audit --audit-level=moderate --json`
# reports 20 advisories today, none production-reachable (the Dockerfile
# build copies only `vite build`'s dist/ output; none of these packages are
# imported by app code). security.yml's frontend-audit job already treats
# dev-dependency advisories as advisory-only for this reason, in its "Full
# advisories including dev dependencies" step. They fall into two chains:
#
# 1. minimatch, ajv, flatted, js-yaml, brace-expansion — transitive through
#    @typescript-eslint/eslint-plugin > ... > eslint, the lint toolchain
#    every PR runs. `react-doctor` (devDependency, kept per the agent-os-3g7
#    decision) bundles its own `eslint-plugin-react-hooks` and so resolves a
#    second copy of the same eslint chain, and some of these advisories list
#    a `react-doctor` path alongside it — but checked via `pnpm audit
#    --audit-level=moderate --json` on 2026-08-03, every one of them also has
#    20+ paths through the direct eslint devDependency with no react-doctor
#    in them. Pinning or removing react-doctor would not clear these; the fix
#    is an eslint-toolchain bump, which will land on its own schedule as
#    upstream (`eslint`, `@typescript-eslint/*`) releases one.
#
# 2. undici — transitive through jsdom > vitest, the test runner's DOM
#    implementation. `pnpm why undici` shows only jsdom/vitest paths; not
#    reachable from react-doctor or any other package. vitest never runs in
#    the built image.
#
# Why no entries in ignoreGhsas above: that list is for a *production*
# finding assessed as unreachable despite `pnpm audit --prod` flagging it.
# Everything here is already excluded from that gate by being a dev
# dependency; adding it to ignoreGhsas would silence a signal
# (`pnpm audit --audit-level=moderate`, the non-gating advisory step) that is
# supposed to stay visible so a sudden jump is noticeable, per that step's
# own comment in security.yml.
overrides:
  # Security: pull fast-uri past the path-traversal fix and past the two host
  # confusion advisories, GHSA-4c8g-83qw-93j6 (fixed 3.1.3) and
  # GHSA-v2hh-gcrm-f6hx (fixed 3.1.4). Reached only via
  # composerize > composeverter > ajv, which declares fast-uri ^3.0.1 and so
  # resolves to a vulnerable 3.1.x on its own. Removable once ajv's own floor
  # moves past 3.1.4.
  #
  # Capped below 4 on purpose: ajv asks for ^3.0.1, so handing it the 4.x major
  # would be an untested API change rather than a security fix.
  #
  # Lives here (not package.json "pnpm.overrides") because pnpm 10.16+/11 reads
  # overrides from pnpm-workspace.yaml.
  fast-uri@<3.1.4: '>=3.1.4 <4'
