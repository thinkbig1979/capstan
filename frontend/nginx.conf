map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve an upstream proxy's X-Forwarded-Proto (e.g. a TLS-terminating
# ingress in front of this container); fall back to this server's scheme.
# The backend uses this to decide the Secure cookie flag and HSTS (M3/L4).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA document and assets (M7). The Go backend sets
    # its own headers for API responses; in the containerized split deployment
    # nginx serves the HTML, so these must be set here too. CSP is limited to
    # frame-ancestors (clickjacking) because a script-src policy on the static
    # bundle would require build-time nonces/hashes. HSTS is intentionally left
    # to the TLS-terminating proxy in front of this HTTP-only container.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback - all non-API routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. nginx resets inherited add_header directives in any
    # location that declares its own, so the security headers are repeated here.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
