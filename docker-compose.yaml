name: capstan

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: capstan
    restart: unless-stopped
    # See docker-compose.prod.yaml's stop_grace_period comment: Docker's 10s
    # default is shorter than the server's own graceful-shutdown budget
    # (up to 15s HTTP drain + up to 30s backup drain — backupDrainTimeout in
    # backend/cmd/server/main.go). 60s covers the ~45s worst case with margin
    # (agent-os-7a5).
    stop_grace_period: 60s
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # STACKS_DIR must be the same path inside and outside the container (see
      # README "Volume Path Identity") — override via a root .env file or
      # `STACKS_DIR=/my/path docker compose up`. Defaults to /opt/stacks,
      # matching backend/internal/config/config.go's built-in default.
      - ${STACKS_DIR:-/opt/stacks}:${STACKS_DIR:-/opt/stacks}
      - ./keys:/app/keys:ro
      - ./data:/app/data
    environment:
      - STACKS_DIR=${STACKS_DIR:-/opt/stacks}
      - HOST_STACKS_DIR=${HOST_STACKS_DIR:-${STACKS_DIR:-/opt/stacks}}
      - DATA_DIR=/app/data
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TRUSTED_NETWORKS=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.18.0.0/16,127.0.0.1,::1
      # Backup — optional env-var fallbacks; DB settings (Settings → Backup) take
      # precedence at runtime. RESTIC_REPOSITORY defaults to /app/data/restic-repo
      # which lives inside the ./data bind mount below.
      # - RESTIC_REPOSITORY=/app/data/restic-repo
      # - RESTIC_PASSWORD=change-me-use-settings-ui-instead
      # - RCLONE_REMOTE=myremote
      # - RCLONE_PATH=capstan-backups
    env_file:
      - ./backend/.env
