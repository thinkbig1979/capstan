name: capstan

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: capstan
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/edwin/development:/home/edwin/development
      - ./keys:/app/keys:ro
      - ./data:/app/data
    environment:
      - STACKS_DIR=/home/edwin/development
      - HOST_STACKS_DIR=/home/edwin/development
      - DATA_DIR=/app/data
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TRUSTED_NETWORKS=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.18.0.0/16,127.0.0.1,::1
      # Backup — optional env-var fallbacks; DB settings (Settings → Backup) take
      # precedence at runtime. RESTIC_REPOSITORY defaults to /app/data/restic-repo
      # which lives inside the ./data bind mount below.
      # - RESTIC_REPOSITORY=/app/data/restic-repo
      # - RESTIC_PASSWORD=change-me-use-settings-ui-instead
      # - RCLONE_REMOTE=myremote
      # - RCLONE_PATH=capstan-backups
    env_file:
      - ./backend/.env
