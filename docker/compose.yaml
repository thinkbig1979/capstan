services:
  capstan:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: capstan
    restart: unless-stopped
    # See docker-compose.prod.yaml's stop_grace_period comment: Docker's 10s
    # default is shorter than the server's own graceful-shutdown budget
    # (up to 15s HTTP drain + up to 30s backup drain — backupDrainTimeout in
    # backend/cmd/server/main.go). 60s covers the ~45s worst case with margin
    # (agent-os-7a5).
    stop_grace_period: 60s
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    volumes:
      # The Docker socket. Capstan joins its group automatically at runtime,
      # so no host changes are needed. (:ro is not used — it would not block
      # the Docker API anyway; see the README "Docker socket & security".)
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      - ./data:/app/data
    environment:
      # JWT_SECRET: REQUIRED for production (generate with: openssl rand -hex 32)
      # STORAGE_KEY: recommended — encrypts stored secrets at rest independently
      #   of JWT_SECRET (generate with: openssl rand -hex 32). Falls back to
      #   JWT_SECRET if unset.
      # Setting AUTH_DISABLED=true bypasses authentication (development only)
      - STACKS_DIR=/opt/stacks
      - DATA_DIR=/app/data
      - PORT=${PORT:-5001}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_KEY=${STORAGE_KEY:-}
      - LOG_LEVEL=info
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Match the host user that owns your stacks/data (default 1000).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Backup — optional env-var fallbacks; DB settings (Settings → Backup) take
      # precedence at runtime. RESTIC_REPOSITORY defaults to /app/data/restic-repo,
      # which lives inside the ./data bind mount above.
      # - RESTIC_REPOSITORY=/app/data/restic-repo
      # - RESTIC_PASSWORD=change-me
      # - RCLONE_REMOTE=myremote
      # - RCLONE_PATH=capstan-backups
    networks:
      - capstan-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
          # Compose spec nests the pids cap under deploy.resources.limits.pids
          # (key "pids", not "pids_limit") — pre-existing misplacement/typo
          # (unrelated to agent-os-rjc) that made `docker compose config` fail
          # schema validation; corrected here only because that command is a
          # required gate for this task.
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # Liveness (no Docker call), and a real GET rather than --spider: --spider
      # sends HEAD, which has no route and falls through to the SPA catch-all,
      # so it returned 200 even when GET /health returned 503 (agent-os-69a).
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:$${PORT:-5001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  capstan-network:
    driver: bridge
