services:
  capstan:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: capstan
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # The Docker socket. Capstan joins its group automatically at runtime,
      # so no host changes are needed. (:ro is not used — it would not block
      # the Docker API anyway; see the README "Docker socket & security".)
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      - ./data:/app/data
    environment:
      # JWT_SECRET: REQUIRED for production (generate with: openssl rand -hex 32)
      # Setting AUTH_DISABLED=true bypasses authentication (development only)
      - STACKS_DIR=/opt/stacks
      - DATA_DIR=/app/data
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=info
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Match the host user that owns your stacks/data (default 1000).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Backup — optional env-var fallbacks; DB settings (Settings → Backup) take
      # precedence at runtime. RESTIC_REPOSITORY defaults to /app/data/restic-repo,
      # which lives inside the ./data bind mount above.
      # - RESTIC_REPOSITORY=/app/data/restic-repo
      # - RESTIC_PASSWORD=change-me
      # - RCLONE_REMOTE=myremote
      # - RCLONE_PATH=capstan-backups
    networks:
      - capstan-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  capstan-network:
    driver: bridge
