# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the PR's changed files and posts a sticky summary comment listing only the new issues introduced relative to the merge base of the target branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: self-hosted
    # Runner dependency: this is a deliberate choice, not an inherited
    # default. Kept on self-hosted rather than moving to ubuntu-latest
    # because the fork guard right below assumes a self-hosted target — it
    # stops a fork PR from running arbitrary code on our own hardware. On a
    # hosted runner the same guard would only be protecting a disposable VM,
    # a much weaker requirement, so switching runners later should come with
    # a re-evaluation of whether the guard is still needed, not a bare
    # runs-on edit. Runner "capstan" was confirmed online and this
    # workflow's most recent push-to-main run completed successfully as of
    # 2026-08-02.
    #
    # Repo is public and this job runs self-hosted: without this guard, a PR
    # from a fork could get its workflow code executed on our runner. Only
    # push events (never fork-originated) and same-repo PRs get through.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20 # Observed <1m typically, up to ~7m; 20m allows slow runs without false timeouts.
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The self-hosted runner container ships Node 10; react-doctor's action
      # needs a modern Node on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        # Advisory by default: React Doctor reports findings on every PR — a
        # sticky summary comment, inline review comments, and a commit status
        # with the health score — but never fails the check, so it won't red-X
        # a teammate's PR on day one. When your team trusts the signal, graduate
        # the gate: uncomment the block below and set blocking to "error" (fail
        # on new error-severity findings) or "warning" (fail on any finding).
        # Full reference: https://www.react.doctor/ci
        #
        # Review cadence (decided 2026-08-03, agent-os-3g7): nobody reads
        # findings on a fixed schedule today. Owner is whoever holds the
        # CI/tooling backlog (currently @edwin); they review at each release
        # cut, and ad hoc whenever the health score on the push-to-main
        # commit status moves materially or a PR's sticky comment reports a
        # new error-severity finding. As of the most recent push-to-main run
        # (2026-08-02), main scored 73/100 (1 error, 52 warnings).
        #
        # A VERSION BUMP MOVES THE SCORE WITHOUT ANY CODE CHANGING, so compare
        # against a baseline taken on the same version. MEASURED 2026-08-08 on
        # an unchanged working tree, running only the local binary and varying
        # nothing but the version (agent-os-vfp):
        #   0.9.2 -> 69/100, 3 errors, 51 warnings, 37 files, exit 1
        #   0.9.3 -> 73/100, 1 error,  53 warnings, 37 files, exit 0
        # The rule "Bugs: Prop callback invoked during render" (3 hits) stopped
        # firing and "Bugs: Ref mutated during render" replaced it as the top
        # error, with 2 additional Performance warnings. No source file was
        # touched between the two runs, so all of that is 0.9.3's ruleset, not
        # a regression or a repair. The next review compares against
        # 0.9.3's 73/100 (1 error, 53 warnings).
        with:
          directory: frontend        # The React app lives here, not at the repo root.
          # Must equal frontend/package.json's react-doctor version. There are
          # only these TWO references now: the repo root previously carried a
          # third (a `react-doctor` devDependency plus a `doctor` script), and
          # the three promptly drifted — root and this file sat at 0.9.1 while
          # frontend moved to 0.9.2, under a comment asserting they could not
          # drift independently. The root copy was a duplicate of frontend's and
          # was removed rather than re-synchronised; a lockstep rule over two
          # files is one you can actually check.
          #
          # 0.9.3 is what frontend/pnpm-lock.yaml resolves as of 2026-08-08
          # (agent-os-vfp). Check with:
          #   grep '"react-doctor"' frontend/package.json
          # and don't take this comment's word for it — the last one asserted a
          # lockstep that had already broken.
          #
          # NOT the newest release, and that is the steady state rather than a
          # backlog item. frontend/pnpm-workspace.yaml sets minimumReleaseAge to
          # 10080 minutes (7 days), and react-doctor republishes its whole
          # toolchain (deslop-js, oxlint-plugin-react-doctor, oxlint,
          # oxc-parser) in lockstep with each release, so every version is
          # unusable here for its first week. OBSERVED 2026-08-08 05:53Z: with
          # react-doctor set to 0.9.3, `pnpm install` failed with
          # ERR_PNPM_NO_MATURE_MATCHING_VERSION naming deslop-js@0.9.3,
          # oxlint-plugin-react-doctor@0.9.3 and react-doctor@0.9.3, all
          # published 2026-08-01 within minutes of each other; the same install
          # at 06:02Z, after 0.9.3's 06:00:59Z publish time cleared the window,
          # exited 0 with no config change. 0.9.4 through 0.9.7 were all still
          # inside the window on that date. Expect to land roughly one release
          # behind, and do NOT add minimumReleaseAgeExclude entries to catch up:
          # excluding a release's ~4 brand-new packages to install it sooner
          # removes the guard exactly where it is doing work.
          version: "0.9.3"
        #   blocking: error          # Gate level: "none" (advisory, the default) | "warning" | "error"
        #   scope: full              # On PRs, scan the whole project instead of just changed files
        #   comment: false           # Disable the sticky PR summary comment
        #   review-comments: false   # Disable inline review comments on changed lines
        #   commit-status: false     # Disable the commit status (score + counts, links to the run)
        #   project: "web,admin"     # In a monorepo, scan specific workspace project(s)
