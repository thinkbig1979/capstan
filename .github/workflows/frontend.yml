# Frontend CI — lint, unit tests, and build for the Vite/React app.
#
# Nothing previously ran the frontend test suite, lint, or build in CI;
# integration.yml only covers backend/**. This workflow closes that gap.
#
# NO PATH FILTER, SINCE agent-os-x8n:
#   This job is a required status check on main. A workflow-level `paths:`
#   filter does not make a required check pass on an unrelated PR — it makes
#   the check never report at all, leaving the PR on "Expected — waiting for
#   status" with no way to merge. See backend.yml's header for the full
#   reasoning and for why a change-detection fan-out was rejected.

name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the exact pnpm version declared in frontend/package.json's (and,
      # as of agent-os-l78, the repo root's) "packageManager" field, so CI
      # never drifts from what contributors run locally. `corepack prepare
      # --activate` was load-bearing here rather than relying on
      # packageManager auto-detection: the repo root's package.json used to
      # have no "packageManager" field, so corepack resolved the wrong
      # (latest installed) pnpm version when invoked outside frontend/ —
      # which is exactly where actions/setup-node's `cache: pnpm` step below
      # runs pnpm from. Both manifests now agree, so auto-detection would
      # work too, but the explicit pin is kept: it costs nothing and removes
      # any dependency on which package.json corepack happens to resolve
      # against.
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: frontend
        run: pnpm test -- --run

      - name: Build
        working-directory: frontend
        run: pnpm build

  # Advisory dead-code / unused-dependency gate (agent-os-237). Deliberately a
  # SEPARATE job from "Lint, test, and build" above: that job is a required
  # status check, and knip findings should flag — not block — a merge. This job
  # is not in the branch-protection required list, matching react-doctor's
  # advisory posture. Exit-code behaviour is defined by frontend/knip.jsonc:
  # unused files/dependencies fail the job; unused exports/types are reported
  # as warnings only.
  knip:
    name: Dead code (knip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: knip
        working-directory: frontend
        run: pnpm knip
