# Frontend CI — lint, unit tests, and build for the Vite/React app.
#
# Nothing previously ran the frontend test suite, lint, or build in CI;
# integration.yml only covers backend/**. This workflow closes that gap.
#
# NO PATH FILTER, SINCE agent-os-x8n:
#   This job is a required status check on main. A workflow-level `paths:`
#   filter does not make a required check pass on an unrelated PR — it makes
#   the check never report at all, leaving the PR on "Expected — waiting for
#   status" with no way to merge. See backend.yml's header for the full
#   reasoning and for why a change-detection fan-out was rejected.

name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the exact pnpm version declared in frontend/package.json's
      # "packageManager" field so CI never drifts from what contributors run
      # locally. `corepack prepare --activate` is used instead of relying on
      # packageManager auto-detection: the repo root has its own
      # (packageManager-less) package.json, so corepack resolves the wrong
      # (latest installed) pnpm version when invoked outside frontend/ —
      # which is exactly where actions/setup-node's `cache: pnpm` step below
      # runs pnpm from.
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: frontend
        run: pnpm test -- --run

      - name: Build
        working-directory: frontend
        run: pnpm build
