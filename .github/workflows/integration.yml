# Integration test workflow — real-Docker tests
#
# RUNNER REQUIREMENTS (all satisfied by ubuntu-latest):
#   - Docker Engine (dockerd) pre-installed and running.
#   - `docker compose` v2 plugin available (ships with Docker on ubuntu-latest).
#   - `docker buildx` available (set up by docker/setup-buildx-action below).
#   - Internet access to docker.io/library/alpine (used as the test image).
#
# ubuntu-latest GitHub-hosted runners have met all of these requirements since
# 2022. No self-hosted runner is needed.
#
# SEPARATION FROM UNIT TESTS:
#   This is a dedicated workflow. The existing docker-publish.yml workflow is
#   untouched. Integration tests carry `-tags=integration` and do NOT run in
#   the normal `go test ./...` (no-tag) path, so they cannot break unit CI.
#
# DELIBERATELY NOT A REQUIRED STATUS CHECK (agent-os-x8n):
#   backend.yml and frontend.yml had their path filters removed so they could
#   be required. This one keeps both its `paths:` and its base-branch filter,
#   and is not required, for two independent reasons:
#
#   1. It would reintroduce as a *merge blocker* the exact fragility that
#      backend.yml was split out to escape. See that file's header: a Docker
#      Hub outage or rate limit fails this job before any test runs. A
#      required check with an external dependency means main is only mergeable
#      when docker.io is reachable.
#   2. Its `branches: [main, 'feat/**']` filter is on the *base* branch, so it
#      skips stacked PRs entirely. As a required check that is a permanent
#      pending status on every stacked PR.
#
#   It stays advisory: it still runs and still goes honestly red on real
#   breakage, and a red advisory check is visible in the PR. Revisit if the
#   suite is ever made independent of Docker Hub — the base-branch filter
#   would have to go first.

name: Integration tests

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      # Re-run when backend Go code changes …
      - 'backend/**'
      # … or when this workflow itself changes.
      - '.github/workflows/integration.yml'
  # Also re-run on merges to main, so a merge commit that combines otherwise
  # passing branches (or a direct push) still gets backend integration
  # coverage instead of relying solely on the pre-merge PR run.
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/integration.yml'
  # Allow manual one-off runs from the Actions tab.
  workflow_dispatch:

jobs:
  integration:
    # Runner: stays GitHub-hosted. This job needs a real Docker daemon
    # (docker compose + buildx), and the self-hosted runner has the docker CLI
    # but NO daemon — `docker info` there fails with "Cannot connect to the
    # Docker daemon at unix:///var/run/docker.sock". Verified 2026-08-07.
    # It also sets CAPSTAN_ALLOW_DESTRUCTIVE_IMAGE_PRUNE=1 below, which prunes
    # every dangling image on whatever daemon it targets — safe on a throwaway
    # hosted VM, emphatically not on a shared host. Both reasons must be
    # resolved before this moves.
    name: Real-Docker integration tests
    runs-on: ubuntu-latest

    # Integration tests can pull images and spin up containers; give them
    # enough time. 10 minutes is generous for the current harness + smoke
    # tests; raise it when Wave B domain tests are added.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Set up Docker Buildx so that `docker buildx imagetools inspect --raw`
      # works correctly (this is the version-independent digest lookup used by
      # the truth package — the exact command that was broken by buildx v0.23
      # on the VPS). Pinning to a recent version avoids the --format bug.
      #
      # driver: docker uses the runner's own daemon as the builder. The default
      # docker-container driver would first pull moby/buildkit from Docker Hub,
      # which is rate-limited for GitHub's shared runner IPs (agent-os-an6d),
      # and this job only needs `imagetools inspect`, which talks to the
      # registry directly and works with any driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # go-version-file reads backend/go.mod and, from setup-go v6, prefers
      # its `toolchain` directive over the `go` directive — so this workflow
      # never drifts from the toolchain the code is pinned to. The v6 pin is
      # load-bearing; v5 reads only the `go` directive. Replaces a
      # `grep '^go '` step that matched that same wrong line. Full note in
      # backend.yml.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Sanity-check: confirm Docker daemon is up and compose v2 is available.
      - name: Verify Docker environment
        run: |
          docker version
          docker compose version
          docker buildx version

      # Run integration tests scoped to the two packages named below, and ONLY
      # those:
      #   - ./internal/integrationtest/  (harness + smoke tests)
      #   - ./internal/truth/...         (added by Wave A1; harmless if absent)
      #
      # There is no ./... discovery here. An integration test placed anywhere
      # else — ./internal/services/, ./internal/handlers/ — will NOT run in
      # this job. Add its package to the list below when that happens.
      #
      # -p 1 runs the two packages one after the other, not side by side, so
      # their registry calls never overlap (ECR Public: one anonymous pull per
      # second; agent-os-an6d). Neither package uses t.Parallel.
      #
      # -count=1 disables the test cache so each run exercises real Docker.
      # -v produces per-test output, useful for CI log triage. It does not
      # suppress the exit code, so one invocation both logs and gates.
      # Every image the integration tests pull, from the ECR Public mirror
      # (not Docker Hub, agent-os-an6d), pulled one at a time with a bounded
      # retry so the mirror's one-pull-per-second limit costs seconds, not a
      # red job. The tests' own `docker pull`s and registry lookups retry too
      # (integrationtest.RetryRegistry, truth's retryRegistry), and compose
      # starts the stacks from these local copies. The list is checked against
      # the refs the tests name by scripts/check-dockerhub-pulls.sh.
      - name: Pre-pull test images (bounded retry)
        run: |
          bash scripts/pull-with-retry.sh \
            public.ecr.aws/docker/library/alpine:3.21 \
            public.ecr.aws/docker/library/alpine:3.20 \
            public.ecr.aws/docker/library/debian:stable-slim

      - name: Run integration tests
        working-directory: backend
        env:
          # Test_Resource_ImagePrune_CountsUntaggedEntries prunes ALL dangling
          # images on the daemon it targets (Docker's image-prune API has no
          # filter that scopes to specific image IDs — see resources_test.go
          # and CONTRIBUTING.md's "## Testing" section). That's destructive
          # on a developer workstation but harmless on this ephemeral,
          # single-use runner, so CI opts in explicitly rather than losing
          # coverage of PruneImages entirely.
          CAPSTAN_ALLOW_DESTRUCTIVE_IMAGE_PRUNE: "1"
        run: |
          go test -tags=integration \
            -p 1 \
            -count=1 \
            -timeout 8m \
            -v \
            ./internal/integrationtest/ \
            ./internal/truth/...

      # Confirm the default (non-tagged) build is still green.
      #
      # This catches a `//go:build integration` tag going missing in
      # ./internal/integrationtest/, because that package's harness is a
      # non-test file behind the same tag — drop the tag from any test there
      # and vet reports `undefined: RequireDocker`.
      #
      # It does NOT catch a leak in ./internal/truth/, whose integration tests
      # are self-contained (stdlib plus shelling out to `docker`). Those vet
      # clean, and they pass here, on a runner that has a daemon. The thing
      # that catches them is backend.yml's Docker-free `go test ./...`, where
      # they fail for want of Docker.
      #
      # This used to also run `go test ./... -count=1`. It no longer needs to:
      # backend.yml runs the full unit suite unconditionally, on every PR that
      # touches backend/**, with no Docker dependency. Keeping the run here
      # only meant the unit signal was hostage to the Docker steps above it —
      # and, per the paragraph above, it would not have caught the truth/ leak
      # anyway, since a daemon is present.
      - name: Confirm default build unaffected
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
