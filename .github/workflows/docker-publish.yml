name: Build and publish image

# Builds the Capstan image and pushes it to the GitHub Container Registry.
# Triggers:
#   - pushing a version tag (v1.2.3)  -> publishes :1.2.3, :1.2, :latest
#   - the "Run workflow" button        -> publishes :manual-<short-sha>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo" (lowercase), e.g. thinkbig1979/capstan,
  # which becomes ghcr.io/thinkbig1979/capstan.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GITHUB_TOKEN to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU only emulates the lightweight runtime-stage steps (apk add, user
      # setup) for arm64; the heavy Go/Node builds cross-compile on the host.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=manual-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          # latest=auto -> :latest is applied only for semver tag builds,
          # never for manual dispatch runs.
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity stamped into the binary via -ldflags. These come from
          # the same metadata-action step that names the image tag, so
          # GET /api/v1/version matches the tag the image was published under:
          # outputs.version is "1.2.3" for a v1.2.3 tag and "manual-<sha>" for a
          # dispatch run. org.opencontainers.image.created is metadata-action's
          # own build timestamp, reused so the label and the API agree.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
