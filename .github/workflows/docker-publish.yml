name: Build and publish image

# Builds the Capstan image and pushes it to the GitHub Container Registry.
# Triggers:
#   - pushing a version tag (v1.2.3)  -> publishes :1.2.3, :1.2, :latest
#   - the "Run workflow" button        -> publishes :manual-<short-sha>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo" (lowercase), e.g. thinkbig1979/capstan,
  # which becomes ghcr.io/thinkbig1979/capstan.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Branch protection does not apply to tags, so without this job the release
  # path is the LEAST gated path into production: `git tag v1.2.3 && git push
  # --tags` publishes :latest off any commit, green or red. That is not
  # hypothetical — v0.16.0 was tagged and published while the most recent E2E
  # run on that exact commit was red (agent-os-fem). It turned out to be a
  # flake, but nothing in the pipeline established that.
  #
  # This gates on EVERY check run on the tagged commit, not just the six
  # required by branch protection. The E2E suites are deliberately not in the
  # required set, and the E2E suite is precisely what was red — a gate that
  # mirrored branch protection would have let that through unchanged.
  verify-checks:
    # Runner: deliberately GitHub-hosted, even though this job needs no local
    # toolchain and would otherwise be a candidate for self-hosted.
    #
    # There is exactly one self-hosted runner and it takes one job at a time.
    # This job WAITS for the tagged commit's other checks to finish — so if it
    # held the only runner slot while the checks it is waiting on were queued
    # behind it, it would deadlock until its own 15-minute timeout and fail
    # every release tagged shortly after a merge. Keeping it hosted also means
    # a release does not depend on the self-hosted runner being online.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require the tagged commit's checks to be green
        uses: actions/github-script@v7
        with:
          script: |
            // Manual dispatch is exempt on purpose: it publishes :manual-<sha>
            // and never moves :latest (see latest=auto below), which is what
            // makes it usable for building a WIP branch to test. Only semver
            // tags reach users.
            //
            // This is a no-op return rather than a job-level `if`, because a
            // SKIPPED job propagates: `needs` treats a skipped dependency as a
            // reason to skip the dependent job too, which would stop manual
            // dispatch publishing anything at all.
            if (context.eventName !== 'push') {
              core.info(`Event is ${context.eventName}, not a tag push — gate not applicable.`)
              return
            }

            // This workflow's own jobs appear as check runs on the same commit;
            // waiting on ourselves would deadlock until the timeout.
            const SELF = new Set(['verify-checks', 'build-and-push'])
            // neutral/skipped are how path-filtered and advisory jobs report a
            // legitimate no-op. Only an actual bad conclusion should block.
            const OK = new Set(['success', 'skipped', 'neutral'])
            const DEADLINE = Date.now() + 15 * 60 * 1000

            while (true) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              })
              const relevant = runs.filter(c => !SELF.has(c.name))

              // No checks at all means the tagged commit never ran CI — e.g. a
              // tag on a commit that was never pushed to a branch. Refusing is
              // the point: "no evidence" is not "green".
              if (relevant.length === 0) {
                core.setFailed(
                  `No check runs found for ${context.sha}. Push the commit to a branch ` +
                  `and let CI run before tagging it.`)
                return
              }

              const bad = relevant.filter(c => c.status === 'completed' && !OK.has(c.conclusion))
              if (bad.length > 0) {
                core.setFailed(
                  `Refusing to publish ${context.ref} from a commit with failing checks:\n` +
                  bad.map(c => `  ✗ ${c.name}: ${c.conclusion}`).join('\n') +
                  `\n\nFix the failure (or re-run a flaky job) and re-push the tag.`)
                return
              }

              const pending = relevant.filter(c => c.status !== 'completed')
              if (pending.length === 0) {
                core.info(`All ${relevant.length} check runs green for ${context.sha}.`)
                return
              }

              // Tagging straight after a merge is normal, so wait rather than
              // failing on checks that simply have not finished yet.
              if (Date.now() > DEADLINE) {
                core.setFailed(
                  `Timed out waiting for checks on ${context.sha}:\n` +
                  pending.map(c => `  … ${c.name}: ${c.status}`).join('\n'))
                return
              }
              core.info(`Waiting on ${pending.length} check run(s): ${pending.map(c => c.name).join(', ')}`)
              await new Promise(r => setTimeout(r, 30000))
            }

  build-and-push:
    # Runner: stays GitHub-hosted. Needs a Docker daemon plus QEMU for the
    # linux/arm64 leg; the self-hosted runner has no daemon (verified
    # 2026-08-07).
    runs-on: ubuntu-latest
    needs: verify-checks
    permissions:
      contents: read
      packages: write   # required for GITHUB_TOKEN to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU only emulates the runtime-stage steps (apt-get install, user setup)
      # for arm64; the heavy Go/Node builds cross-compile on the host. Note that
      # since the move to Debian bases this leg is slower than it was under
      # Alpine — dpkg/apt under emulation costs more than apk did.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=manual-,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          # latest=auto -> :latest is applied only for semver tag builds,
          # never for manual dispatch runs.
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity stamped into the binary via -ldflags. These come from
          # the same metadata-action step that names the image tag, so
          # GET /api/v1/version matches the tag the image was published under:
          # outputs.version is "1.2.3" for a v1.2.3 tag and "manual-<sha>" for a
          # dispatch run. org.opencontainers.image.created is metadata-action's
          # own build timestamp, reused so the label and the API agree.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
