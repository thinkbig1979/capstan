# Backup-flow E2E — Playwright suite against a real Capstan instance
# (agent-os-5y9).
#
# WHY BOTH PER-PR AND NIGHTLY (agent-os-h9r):
#   The suite is `workers: 1`, sequential (tests share stack/snapshot state
#   within the describe block — see backup-flow.spec.ts), with a 120s
#   per-test timeout, and drives real restic I/O plus WebSocket streaming
#   end to end: login -> configure backup -> init repo -> enable policy ->
#   run backup -> verify snapshot -> restore -> verify post-restore state.
#   That is exactly the coverage unit tests cannot give — backup is the
#   highest-risk subsystem in this codebase (the DR drill that found
#   agent-os-pid lived here). It previously ran nightly plus on-demand only,
#   on the theory that it was too slow for PR feedback — but a suite that
#   never runs on a PR gates nothing: it emits no signal a reviewer or branch
#   protection can act on, which is worse than an admittedly-missing gate
#   because the green state elsewhere reads as coverage that isn't there
#   (agent-os-h9r). It now also runs on every `pull_request` (see the trigger
#   below), matching backend.yml's and security.yml's `pull_request:` +
#   `push: branches: [main]` block — deliberately unfiltered, not a `paths:`
#   filter, for the reason those two files document: a paths-filtered
#   workflow that is also a required status check stays permanently pending
#   on PRs that don't touch a matching path (agent-os-x8n).
#
#   The nightly cron stays alongside the PR run rather than being replaced by
#   it, for the same reason security.yml keeps its weekly scan next to its
#   PR run: a PR-triggered run only catches what *that PR* changes, not
#   environmental rot — a restic release going bad, a Playwright/Chromium
#   update breaking headless launch, backend behaviour drifting under a
#   dependency bump nobody's PR touched. Nightly is what catches that class
#   of failure independent of any single change landing.
#
# WHAT AGENT-OS-5Y9 PHASE 1 FOUND (2026-08-02/03):
#   The suite had rotted — 2 of 7 tests failed — but both failures were
#   narrow, dated spec bugs against stable backend behaviour, not flakiness
#   and not the Playwright 1.58->1.62 bump that landed underneath it:
#     - runViaWs() checked a `success` boolean the WS `done` frame has never
#       sent; it sends `outcome: "success"|"partial"|"failed"` (added in
#       54cd300, 2026-06-03).
#     - Snapshot selection took `snapshotList[0]` from the UNSCOPED
#       GET /backups/snapshots, which as of 7d613ab (2026-07-31) also
#       contains the automatic capstan-database self-backup snapshot, so
#       index 0 is not reliably this stack's own snapshot.
#   Both are fixed in the same change that added this workflow — see the
#   inline comments in backup-flow.spec.ts for the full detail and the exact
#   backend lines each was diagnosed against.
#
# RUNNER REQUIREMENTS (all satisfied by ubuntu-latest):
#   - restic 0.18.0+ on PATH — installed below, pinned to the same version
#     and checksum as docker/Dockerfile's backup-tools stage, so this
#     workflow is never exercising a different restic than production ships.
#   - Docker Engine present. Not actually exercised by this spec today — the
#     backup flow is restic-driven file-level backup of the stack directory,
#     not container lifecycle — but kept as a stated requirement since the
#     backend is a Docker-managing service by design.
#
# TEST FIXTURE:
#   The spec expects a stack named `test-app` to already exist (it does not
#   create one itself). It is seeded here by writing its compose file
#   directly into STACKS_DIR before the backend's first startup scan, so the
#   directory-scanner path registers it (correct insert order: directory row
#   before stack row). This deliberately avoids POST /api/v1/stacks, which
#   currently 500s on a brand-new stack directory once FK enforcement went
#   pool-wide (agent-os-jcu, a real backend bug found during agent-os-5y9
#   Phase 1 and filed separately — out of scope for this workflow).
#
# AUTH-SESSION SPLIT (agent-os-lyx, 2026-08-04):
#   This file also runs testing/tests/playwright/auth-session.spec.ts, but in
#   a SEPARATE job (`auth-session`) against a SEPARATE backend booted with
#   AUTH_DISABLED=false — the backup-flow job above runs AUTH_DISABLED=true
#   throughout and never exercises real sessions. The two jobs route by test
#   PATH via --grep/--grep-invert, not by tag: backup-flow keeps
#   `--grep-invert "auth-session"` so it never spends time on a backend it
#   can't use, and auth-session gets `--grep "auth-session"`. The
#   auth-session job needs neither restic nor the test-app fixture (its spec
#   touches neither), so both are skipped for it entirely.

name: E2E - Backup flow

on:
  # Deliberately unfiltered — see the WHY BOTH PER-PR AND NIGHTLY note above.
  # No `paths:` filter: agent-os-x8n showed that a paths-filtered workflow
  # that is also a required status check stays permanently pending on PRs
  # that don't touch a matching path, so this follows backend.yml's and
  # security.yml's pattern of running on every PR instead.
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 03:17 UTC daily — off the top of the hour to avoid the scheduling
    # stampede every workflow with a bare `0 * * * *`-style cron competes in.
    - cron: '17 3 * * *'
  # Allow manual one-off runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Groups PR runs by PR number and push-to-main runs by ref, cancelling a
# superseded run the moment a newer commit lands — same pattern as
# security.yml and react-doctor.yml. The scheduled nightly run gets its OWN
# group ('nightly', not ref-keyed) instead of sharing the push-to-main group:
# cancel-in-progress is evaluated on the INCOMING run, not the one already
# running, so if schedule and push shared a group, an ordinary push arriving
# while the nightly is in-flight would still cancel it (the push's own
# cancel-in-progress is true) even though the schedule run's cancel-in-progress
# is false. Isolating the schedule group closes that regardless of arrival
# order — nothing else can ever land in the 'nightly' group to cancel it.
concurrency:
  group: e2e-backup-${{ github.event_name == 'schedule' && 'nightly' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  backup-flow:
    name: Playwright backup-flow suite
    # Runner: stays GitHub-hosted. Despite being a Playwright suite with no
    # obvious Docker step, this exercises the real backup path, which STOPS the
    # stack before snapshotting it — so it needs a Docker daemon. Observed on
    # PR 147 when it moved to self-hosted: "stack stacks~test-app:default
    # failed: stop stack: docker daemon unreachable", 3 of 7 tests failing.
    # The auth-session job below has no such dependency and does run
    # self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin the exact pnpm version declared in the repo root's and frontend's
      # "packageManager" fields, matching frontend.yml's rationale.
      # Bootstrap a modern Node BEFORE the corepack step below. corepack ships
      # with Node >=16.9; the self-hosted runner's baseline Node is v10, so
      # `corepack enable` there fails with "command not found" (observed on
      # PR 147). GitHub-hosted runners happen to preinstall a Node new enough
      # that this never mattered, which is why the ordering was fine until the
      # jobs moved. The `Set up Node` step further down still runs: this one
      # only puts corepack on PATH, that one owns the pnpm cache — which needs
      # pnpm to already be resolvable, hence the corepack step between them.
      - name: Bootstrap Node for corepack
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Root is pnpm-managed as of agent-os-l78 and carries the Playwright
      # devDependency; frontend/ is a separate pnpm project with its own
      # lockfile (see docker/Dockerfile's frontend-build stage).
      - name: Install root dependencies (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Pinned to the same version + checksum as docker/Dockerfile's
      # backup-tools stage (RESTIC_VER / RESTIC_SHA256_AMD64) — keep the two
      # in lockstep when bumping either one.
      - name: Install restic
        run: |
          set -eu
          RESTIC_VER=0.19.1
          RESTIC_SHA256=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
          curl -fsSL \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VER}/restic_${RESTIC_VER}_linux_amd64.bz2" \
            -o /tmp/restic.bz2
          echo "${RESTIC_SHA256}  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 /tmp/restic.bz2
          sudo mv /tmp/restic /usr/local/bin/restic
          sudo chmod +x /usr/local/bin/restic
          restic version

      - name: Build backend
        working-directory: backend
        run: go build -o server ./cmd/server

      # Seed the test-app fixture before the backend's first startup scan —
      # see the TEST FIXTURE note in the file header for why this bypasses
      # POST /api/v1/stacks.
      - name: Seed test-app stack fixture
        run: |
          set -eu
          mkdir -p /tmp/capstan-e2e/stacks/test-app /tmp/capstan-e2e/data
          cat > /tmp/capstan-e2e/stacks/test-app/compose.yaml <<'EOF'
          services:
            web:
              image: nginx:1.25-alpine
              restart: unless-stopped
          EOF

      - name: Start backend
        working-directory: backend
        run: |
          set -eu
          PORT=5001 \
          STACKS_DIR=/tmp/capstan-e2e/stacks \
          DATA_DIR=/tmp/capstan-e2e/data \
          AUTH_DISABLED=true \
          JWT_SECRET=e2e-ci-secret-32-characters-min-pad \
          LOG_LEVEL=info \
          LOG_FORMAT=text \
          CORS_ORIGINS=http://localhost:3001 \
          # The whole suite shares ONE rate-limit bucket. RateLimitByUser keys
          # on the user UUID when a request is authenticated and on the client
          # IP otherwise, and here every request comes from ::1 — under
          # AUTH_DISABLED=true nothing is ever authenticated, so the entire run
          # spends a single budget. OBSERVED in run 33508313900: this suite made
          # 352 requests in 58.96s, crossed the 300/min default at t+53s, and
          # then 429'd tests that had nothing to do with the traffic that spent
          # the budget (terminal-flow.spec.ts:90). Production is unaffected by
          # this variable and unaffected by that aggregation: with auth on, each
          # user keys on their own UUID.
          #
          # 2000 is a ceiling with ~5.6x headroom over the observed rate, not an
          # off switch: a runaway retry loop still trips it, which is the signal
          # worth keeping.
          RATE_LIMIT_API_PER_MIN=2000 \
          nohup ./server > /tmp/capstan-e2e/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health > /dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy within 30s" >&2
          cat /tmp/capstan-e2e/backend.log
          exit 1

      # frontend/vite.config.ts proxies /api to the hardcoded
      # http://localhost:5001 in dev mode, matching the backend port above —
      # no override needed. --port/--strictPort pin 3001 to match
      # playwright.config.ts's CAPSTAN_BASE_URL default.
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          set -eu
          nohup npx vite --port 3001 --strictPort > /tmp/capstan-e2e/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ > /dev/null; then
              echo "frontend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "frontend did not become healthy within 30s" >&2
          cat /tmp/capstan-e2e/frontend.log
          exit 1

      - name: Run Playwright e2e suite
        env:
          CAPSTAN_BASE_URL: http://localhost:3001
          CAPSTAN_API_URL: http://localhost:5001
          AUTH_DISABLED: 'true'
          CAPSTAN_TEST_STACK: test-app
        # No spec path argument: a hardcoded path
        # (testing/tests/playwright/backup-flow.spec.ts) only ever selected
        # that one file — a newly added spec under testDir was silently never
        # run, and CI stayed green because nothing had failed, it just hadn't
        # executed (agent-os-h9r). Bare `npx playwright test` discovers every
        # spec via playwright.config.ts's `testDir: './testing/tests/playwright'`
        # + `testMatch: '**/*.spec.ts'`, so new coverage is picked up
        # automatically instead of requiring a matching edit to this workflow.
        #
        # --grep-invert "auth-session" (agent-os-lyx): this job boots the
        # backend with AUTH_DISABLED=true and cannot run
        # auth-session.spec.ts, which needs a real, revocable session.
        # --grep-invert matches against the full test title INCLUDING its
        # file path (OBSERVED: `--grep "backup-flow" --list` selects all 7
        # tests here though no test title contains that string), so this
        # reliably excludes only auth-session.spec.ts's tests. Renaming or
        # deleting that file changes nothing here — inverting an exclusion
        # of a pattern nothing matches still selects all 7 backup-flow tests
        # (OBSERVED: `--grep-invert "auth-session" --list` with the spec
        # absent still selects 7, EXIT 0). The zero-match tripwire this
        # workflow relies on lives in the OTHER job instead: Playwright
        # exits 1 on a total zero-match, so it's the auth-session job's
        # `--grep "auth-session"` (a positive selection) that fails loudly
        # if that spec is ever renamed or deleted, not this step.
        #
        # No --reporter flag: it REPLACES playwright.config.ts's reporter
        # array wholesale, including each reporter's options — so even
        # `--reporter=list,html,json` silently drops the config's custom
        # outputFolder/outputFile and falls back to the html reporter's
        # default 'playwright-report/' and the json reporter's default
        # (stdout), leaving the "Upload Playwright HTML report" step below
        # with nothing at the path it expects. Verified empirically: with the
        # flag, `--list` still prints a JSON summary to stdout instead of
        # writing testing/reports/playwright-results.json. Omitting the flag
        # entirely lets the config's list+html+json array (with its custom
        # paths) apply as configured — confirmed against a deliberately
        # broken run during agent-os-5y9, where the upload step had
        # previously reported success on 0 files rather than failing loudly.
        run: npx playwright test --grep-invert "auth-session"

      # A scheduled job whose failures cannot be inspected gets ignored —
      # upload the HTML report (configured in playwright.config.ts) whenever
      # the suite fails.
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: testing/reports/playwright-html
          retention-days: 14

      - name: Upload backend/frontend logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capstan-e2e-logs
          path: |
            /tmp/capstan-e2e/backend.log
            /tmp/capstan-e2e/frontend.log
          retention-days: 14

  auth-session:
    name: Playwright auth-session suite
    # Runner: self-hosted by default, EXCEPT for pull requests from forks.
    # This repo is public with forking enabled, so a fork PR running on our own
    # hardware would be arbitrary code execution on the runner host. Falling
    # back to a disposable GitHub-hosted VM for fork PRs keeps that code off our
    # box while still reporting the check — which matters because several of
    # these are required by branch protection, and a skipped required check
    # blocks a PR forever rather than failing it honestly.
    #
    # `capstan-e2e` narrows the self-hosted side to ONE runner process. There
    # are now three (capstan, capstan-2, capstan-3) sharing a host, and this job
    # is the only self-hosted one that binds ports — 5001 for the backend, 3001
    # for the frontend — and writes a fixed path, /tmp/capstan-e2e-auth. Two
    # copies on that host would fight over all three. The per-PR `concurrency`
    # group does not save us: it stops one branch overlapping itself, not two
    # different PRs running at once, which is exactly what three runners make
    # possible for the first time.
    #
    # Pinning rather than parameterising is deliberate. Giving each runner its
    # own port range means moving the backend off 5001, and
    # frontend/vite.config.ts hardcodes its /api proxy target to
    # http://localhost:5001 — shared with local development, so that is app
    # config changing to suit CI. One label is the smaller change.
    #
    # The label lives on runner `capstan` only, in
    # /home/dockge/stacks/github-actions-thinkbig/compose.yaml on the runner
    # host. It must exist there BEFORE this line merges: a runs-on label that no
    # runner carries does not fail, it queues forever.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","capstan-e2e"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bootstrap a modern Node BEFORE the corepack step below. corepack ships
      # with Node >=16.9; the self-hosted runner's baseline Node is v10, so
      # `corepack enable` there fails with "command not found" (observed on
      # PR 147). GitHub-hosted runners happen to preinstall a Node new enough
      # that this never mattered, which is why the ordering was fine until the
      # jobs moved. The `Set up Node` step further down still runs: this one
      # only puts corepack on PATH, that one owns the pnpm cache — which needs
      # pnpm to already be resolvable, hence the corepack step between them.
      - name: Bootstrap Node for corepack
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install root dependencies (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No restic install and no test-app fixture seed here — unlike the
      # backup-flow job above, auth-session.spec.ts never touches backups or
      # stacks beyond an authenticated GET /stacks, so it needs neither.
      - name: Build backend
        working-directory: backend
        run: go build -o server ./cmd/server

      # A FRESH, isolated DATA_DIR is load-bearing: auth-session.spec.ts's
      # first test asserts needsSetup:true and performs the one-and-only
      # POST /auth/setup itself. A dir shared with the backup-flow job (or
      # reused across re-runs) would carry over a user from a previous run
      # and make that assertion false.
      - name: Start backend (AUTH_DISABLED=false)
        working-directory: backend
        run: |
          set -eu
          # Self-hosted runners are NOT ephemeral: /tmp survives between runs,
          # so a previous run's capstan.db would satisfy the one-and-only
          # POST /auth/setup and make AUTH-PW-SESSION-001's needsSetup:true
          # assertion false. Observed on PR 147: the job passed on its first
          # self-hosted run and failed on the second. Hosted runners hid this
          # by giving every job a clean VM.
          rm -rf /tmp/capstan-e2e-auth
          mkdir -p /tmp/capstan-e2e-auth/stacks /tmp/capstan-e2e-auth/data
          PORT=5001 \
          STACKS_DIR=/tmp/capstan-e2e-auth/stacks \
          DATA_DIR=/tmp/capstan-e2e-auth/data \
          AUTH_DISABLED=false \
          JWT_SECRET=e2e-ci-secret-32-characters-min-pad \
          LOG_LEVEL=info \
          LOG_FORMAT=text \
          CORS_ORIGINS=http://localhost:3001 \
          # Same single-bucket exposure as the backup-flow job. Authenticated
          # requests here key on the user UUID, but every pre-login and
          # unauthenticated request still lands in the one ::1 bucket, so this
          # suite can reach the same ceiling by a narrower route. Raised
          # pre-emptively — NOT observed failing this way, unlike backup-flow.
          RATE_LIMIT_API_PER_MIN=2000 \
          nohup ./server > /tmp/capstan-e2e-auth/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health > /dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy within 30s" >&2
          cat /tmp/capstan-e2e-auth/backend.log
          exit 1

      # Same rationale as the backup-flow job: frontend/vite.config.ts
      # hardcodes the /api proxy to http://localhost:5001, so no override is
      # needed or possible; --port/--strictPort pin 3001 to match
      # playwright.config.ts's CAPSTAN_BASE_URL default. Separate runner from
      # the backup-flow job, so both using 5001/3001 is not a conflict.
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          set -eu
          nohup npx vite --port 3001 --strictPort > /tmp/capstan-e2e-auth/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ > /dev/null; then
              echo "frontend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "frontend did not become healthy within 30s" >&2
          cat /tmp/capstan-e2e-auth/frontend.log
          exit 1

      - name: Run Playwright auth-session suite
        env:
          CAPSTAN_BASE_URL: http://localhost:3001
          CAPSTAN_API_URL: http://localhost:5001
        # --grep "auth-session" selects only auth-session.spec.ts (matched
        # against the full test title including its file path — see the
        # --grep-invert comment in the backup-flow job above for the
        # observed behaviour this relies on, and the zero-match tripwire
        # this specific flag is what actually provides). AUTH_DISABLED is
        # deliberately left unset: auth-session.spec.ts never reads that env
        # var at all (unlike backup-flow.spec.ts, which branches its login
        # flow on it) — its every assertion already assumes a real,
        # revocable session, matching this job's backend unconditionally.
        # There is no test.skip(AUTH_DISABLED) guard to key off either —
        # under path-based routing this job must always run these tests,
        # never skip them silently.
        #
        # This job assumes a VIRGIN backend (needsSetup:true) and is
        # single-spec-by-design: auth-session.spec.ts's first test performs
        # the one-and-only POST /auth/setup itself and asserts needsSetup
        # was true beforehand. A second spec file whose title also happened
        # to match "auth-session" would run against this SAME backend
        # process and break that bootstrap assertion on its second run — if
        # a future spec ever needs this same AUTH_DISABLED=false backend,
        # give it its own job (or its own isolated backend instance) rather
        # than adding it here.
        #
        # No --reporter flag, for the same reason as the backup-flow job:
        # it would replace playwright.config.ts's list+html+json reporter
        # array wholesale and break the HTML report upload below.
        run: npx playwright test --grep "auth-session"

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report-auth-session
          path: testing/reports/playwright-html
          retention-days: 14

      - name: Upload backend/frontend logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capstan-e2e-auth-session-logs
          path: |
            /tmp/capstan-e2e-auth/backend.log
            /tmp/capstan-e2e-auth/frontend.log
          retention-days: 14
