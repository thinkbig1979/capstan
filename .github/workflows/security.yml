# Security CI — dependency and image vulnerability scanning.
#
# WHY THIS IS A SEPARATE WORKFLOW:
#   A scan failure means "a new advisory affects us", which is a different
#   thing from "the build broke". Bolting these jobs onto backend.yml or
#   frontend.yml would entangle the two, so a red X could mean either, and a
#   scan that goes red for reasons outside the PR would train people to ignore
#   the build check as well.
#
# WHY THE SCHEDULE IS THE IMPORTANT TRIGGER:
#   A push-triggered scan only catches vulnerabilities *this repo introduces*.
#   Most do not arrive that way — they arrive when a researcher publishes an
#   advisory against code nobody has touched in months. Without the weekly run,
#   this workflow would go stale silently and still show green.
#
# NO PATH FILTERS, DELIBERATELY:
#   Every other workflow here filters on paths. This one must not. The whole
#   point is to scan unchanged code against a changed advisory database, and a
#   path-filtered workflow is also what leaves a required status check
#   permanently pending on unrelated PRs once branch protection lands
#   (agent-os-x8n).
#
# GATE LEVELS — see each job for the specific rationale. In summary:
#   BLOCKING  Go vulnerabilities govulncheck reports as reachable (called).
#   BLOCKING  Production npm advisories at high severity or above.
#   ADVISORY  Dev-dependency npm advisories.
#   ADVISORY  Container image findings.
#   The blocking set is deliberately narrow. A gate that fires on findings
#   nobody can act on gets routed around, and then it protects nothing.

name: Security

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly, Monday 04:17 UTC. The odd minute is intentional: scheduled jobs on
  # the hour contend with everyone else's, and GitHub drops queued runs under
  # load rather than delaying them.
  schedule:
    - cron: '17 4 * * 1'
  # Allows dispatching from the Actions tab, which is also how the schedule
  # wiring gets verified without waiting a week.
  workflow_dispatch:

permissions:
  contents: read

# A scan of an older commit tells you nothing once a newer one exists, so PR and
# push runs cancel superseded runs. The weekly scheduled scan gets its OWN group
# ('weekly', not ref-keyed): cancel-in-progress is evaluated on the INCOMING run,
# so if schedule and push shared a group a push arriving during the weekly scan
# would cancel it (the push's own cancel-in-progress is true) even though the
# schedule run's is false. Isolating the schedule group keeps the weekly advisory
# scan from being cancelled by a routine push (agent-os-eyc; same pattern as
# e2e-backup.yml).
concurrency:
  group: security-${{ github.event_name == 'schedule' && 'weekly' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ---------------------------------------------------------------------------
  # Go dependencies
  # ---------------------------------------------------------------------------
  go-vulns:
    name: Go vulnerabilities (govulncheck)
    # Runner: self-hosted by default, EXCEPT for pull requests from forks.
    # This repo is public with forking enabled, so a fork PR running on our own
    # hardware would be arbitrary code execution on the runner host. Falling
    # back to a disposable GitHub-hosted VM for fork PRs keeps that code off our
    # box while still reporting the check — which matters because several of
    # these are required by branch protection, and a skipped required check
    # blocks a PR forever rather than failing it honestly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-go@v6 or later is load-bearing: v5 reads only go.mod's `go`
      # directive, and backend/go.mod carries both `go 1.25.0` and
      # `toolchain go1.26.5`. See backend.yml for the full explanation.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The only line in the log that states what actually compiled, rather
      # than what was requested. GOTOOLCHAIN=auto re-execs invisibly.
      - name: Report Go version
        working-directory: backend
        run: go version

      # Deliberately @latest rather than a pin. Pinning the scanner would not
      # make the scan reproducible anyway — the vulnerability database is
      # fetched at run time — and an old analyzer is strictly worse at finding
      # things. Freshness beats reproducibility for this specific tool.
      #
      # The script runs exactly that command and retries it ONLY on a
      # recognised stall of the module proxy or vuln.go.dev, never on a
      # finding (findings live in the JSON and are judged by the gate below,
      # which is unchanged). Signatures and sizing are measured and documented
      # in the script header. See agent-os-pvta.
      - name: Run govulncheck
        working-directory: backend
        run: bash "${GITHUB_WORKSPACE}/scripts/govulncheck-retry.sh" "${RUNNER_TEMP}/govulncheck.json"

      # WHY THIS PARSES JSON INSTEAD OF CHECKING THE EXIT CODE:
      #   `govulncheck -format json` exits 0 unconditionally, including when it
      #   finds reachable vulnerabilities. The obvious formulation —
      #   `govulncheck ./... || exit 1` — would look correct, pass review, and
      #   never fire. Verified against this repo on 2026-07-31.
      #
      # WHY IT GATES ON THE SYMBOL TIER:
      #   govulncheck reports three tiers. A finding whose trace carries a
      #   `function` is one govulncheck traced to a call in our code; those are
      #   the high-signal ones. Findings that name only a package (imported) or
      #   only a module (required) are reported here for visibility but do not
      #   gate — treating "a module we depend on has an advisory in code we
      #   never call" as a build failure is how a gate loses its audience.
      #
      # ACCEPTED EXCEPTIONS (symbol-tier findings that do not fail this job):
      #   Both are docker/docker, both found in v28.5.2+incompatible, both
      #   with "Fixed in: N/A" — no upstream release carries a fix, so there is
      #   no version to move to. The reachability assessment recorded in
      #   agent-os-vkr is that neither is exploitable through capstan: both
      #   are daemon-side, and capstan links only the API client
      #   (github.com/docker/docker/api/** and .../client).
      #
      #     GO-2026-4887  AuthZ plugin bypass on oversized request bodies.
      #                   Daemon-side; capstan runs no authz plugins.
      #     GO-2026-4883  off-by-one in plugin privilege validation. Daemon-side;
      #                   capstan has no PluginInstall / PluginUpgrade call sites.
      #
      # DELIBERATELY *NOT* IN THE LIST:
      #   Three further docker/docker advisories land on the same
      #   v28.5.2+incompatible, all reported at module tier only —
      #   their sole finding carries neither `package` nor `function`, so the
      #   symbol-tier gate below never sees them and an allowlist entry would
      #   protect nothing and trip the stale-exception notice on every run.
      #
      #     GO-2026-5746  CVE-2026-41567 / GHSA-x86f-5xw2-fm2r. `PUT
      #                   /containers/{id}/archive` executes container binaries.
      #                   Daemon-side; capstan has no CopyToContainer call sites.
      #     GO-2026-5668  race in `docker cp`; arbitrary empty-file creation on
      #                   the host via symlink swap. Daemon-side. capstan has no
      #                   CopyToContainer / CopyFromContainer call sites. Was an
      #                   accepted exception until 2026-08-20, when govulncheck
      #                   stopped tracing a call to it and CI began reporting
      #                   the entry as stale.
      #     GO-2026-5617  CVE-2026-42306 / GHSA-rg2x-37c3-w2rh. Race in
      #                   `docker cp` allows bind mount redirection. Daemon-side,
      #                   the same class as GO-2026-5668 above.
      #
      #   They are written down here rather than left out silently because
      #   Dependabot raises all three as runtime-scope alerts, and the answer
      #   to "why is this one not allowlisted like the other two?" needs to be
      #   "it does not need to be", not "nobody looked". Verified 2026-08-01;
      #   tiers re-confirmed 2026-08-20.
      #
      #   This assessment is tied to what capstan imports *today* and expires:
      #   agent-os-96h re-checks all five on 2026-10-30, including re-running
      #   `go list -deps ./... | grep '^github.com/docker/docker'` to confirm
      #   only api/** and client are still linked, and re-checking whether
      #   GO-2026-5746 / GO-2026-5617 / GO-2026-5668 have risen to the symbol
      #   tier. Delete entries from this list when a fix ships; do not extend
      #   the list without the same standard of written reachability evidence.
      - name: Evaluate findings against accepted exceptions
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/govulncheck.json"

          cat > "${RUNNER_TEMP}/allowed.txt" <<'ALLOWED'
          GO-2026-4883
          GO-2026-4887
          ALLOWED
          sort -u -o "${RUNNER_TEMP}/allowed.txt" "${RUNNER_TEMP}/allowed.txt"

          # Symbol tier: govulncheck traced a call from our code.
          jq -r 'select(has("finding")) | .finding
                 | select(.trace[0].function != null) | .osv' "${REPORT}" \
            | sort -u > "${RUNNER_TEMP}/called.txt"

          # Module tier: required but neither imported nor called. Informational.
          jq -r 'select(has("finding")) | .finding
                 | select(.trace[0].package == null) | .osv' "${REPORT}" \
            | sort -u > "${RUNNER_TEMP}/module.txt"

          comm -23 "${RUNNER_TEMP}/called.txt" "${RUNNER_TEMP}/allowed.txt" \
            > "${RUNNER_TEMP}/unexpected.txt"
          comm -13 "${RUNNER_TEMP}/called.txt" "${RUNNER_TEMP}/allowed.txt" \
            > "${RUNNER_TEMP}/stale.txt"

          {
            echo '## govulncheck'
            echo
            echo "Reachable (symbol tier): $(wc -l < "${RUNNER_TEMP}/called.txt")"
            echo "Accepted exceptions: $(wc -l < "${RUNNER_TEMP}/allowed.txt")"
            echo "Module tier (informational): $(wc -l < "${RUNNER_TEMP}/module.txt")"
            echo
            if [ -s "${RUNNER_TEMP}/module.txt" ]; then
              echo '<details><summary>Module-tier findings (not gated)</summary>'
              echo
              sed 's/^/- /' "${RUNNER_TEMP}/module.txt"
              echo
              echo '</details>'
              echo
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          # A stale exception is not a failure, but it is rot: it means an
          # allowlist entry is protecting nothing and should be removed.
          if [ -s "${RUNNER_TEMP}/stale.txt" ]; then
            echo '> **Note:** these accepted exceptions no longer appear and can be removed:' \
              >> "${GITHUB_STEP_SUMMARY}"
            sed 's/^/> - /' "${RUNNER_TEMP}/stale.txt" >> "${GITHUB_STEP_SUMMARY}"
            echo '::notice::Stale govulncheck exceptions (no longer reported):' \
              "$(tr '\n' ' ' < "${RUNNER_TEMP}/stale.txt")"
          fi

          if [ -s "${RUNNER_TEMP}/unexpected.txt" ]; then
            {
              echo
              echo '### :x: New reachable vulnerabilities'
              echo
              sed 's/^/- /' "${RUNNER_TEMP}/unexpected.txt"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo '::error::govulncheck reports reachable vulnerabilities that are not accepted exceptions:' \
              "$(tr '\n' ' ' < "${RUNNER_TEMP}/unexpected.txt")"
            echo
            echo 'Full report for the findings above:'
            go run golang.org/x/vuln/cmd/govulncheck@latest -format text ./... || true
            exit 1
          fi

          echo ':white_check_mark: No reachable vulnerabilities outside the accepted set.' \
            >> "${GITHUB_STEP_SUMMARY}"
        working-directory: backend

  # ---------------------------------------------------------------------------
  # Frontend dependencies
  # ---------------------------------------------------------------------------
  frontend-audit:
    name: npm advisories (pnpm audit)
    # Runner: self-hosted by default, EXCEPT for pull requests from forks.
    # This repo is public with forking enabled, so a fork PR running on our own
    # hardware would be arbitrary code execution on the runner host. Falling
    # back to a disposable GitHub-hosted VM for fork PRs keeps that code off our
    # box while still reporting the check — which matters because several of
    # these are required by branch protection, and a skipped required check
    # blocks a PR forever rather than failing it honestly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same corepack dance as frontend.yml, and now also used below to
      # install the repo root's own pnpm-managed tree (cclsp, playwright).
      # Explicit version pin rather than packageManager auto-detection: this
      # used to be load-bearing because the repo root's package.json had no
      # "packageManager" field, so corepack resolved the wrong (latest
      # installed) pnpm when invoked outside frontend/. As of agent-os-l78
      # both manifests declare pnpm@11.5.1, so this is redundant-but-harmless
      # rather than load-bearing — see frontend.yml's corepack comment for the
      # full history.
      # Bootstrap a modern Node BEFORE the corepack step below. corepack ships
      # with Node >=16.9; the self-hosted runner's baseline Node is v10, so
      # `corepack enable` there fails with "command not found" (observed on
      # PR 147). GitHub-hosted runners happen to preinstall a Node new enough
      # that this never mattered, which is why the ordering was fine until the
      # jobs moved. The `Set up Node` step further down still runs: this one
      # only puts corepack on PATH, that one owns the pnpm cache — which needs
      # pnpm to already be resolvable, hence the corepack step between them.
      - name: Bootstrap Node for corepack
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # BLOCKING. Production dependencies ship to users inside the image, so a
      # high-or-critical advisory here is a real exposure, not a maintenance
      # chore.
      #
      # ACCEPTED EXCEPTION: GHSA-qwww-vcr4-c8h2 (react-router RSC Mode CSRF
      # bypass) is suppressed via `auditConfig.ignoreGhsas` in
      # frontend/pnpm-workspace.yaml, where the reasoning lives next to it.
      # Short version: it is patched only in react-router >=8.3.0,
      # react-router-dom has no 8.x release, and the advisory text scopes the
      # impact to the unstable RSC APIs, which capstan does not use. Tracked as
      # agent-os-e0t; delete the exception when that migration lands.
      #
      # The suppression is visible, not silent — pnpm still prints the finding
      # and appends "(N ignored)" to the severity line. That is why the
      # exception lives in config rather than behind `|| true`, which would
      # disable the entire gate rather than one known finding.
      - name: Production advisories (blocking, high and above)
        working-directory: frontend
        run: bash "${GITHUB_WORKSPACE}/scripts/pnpm-audit-retry.sh" --prod --audit-level=high

      # ADVISORY. Dev dependencies do not reach the runtime: the Dockerfile runs
      # `pnpm build` and copies only dist/. As of 2026-07-31 this reports ~30
      # findings, and every one is a transitive pinned by a parent that has not
      # raised its floor (undici via jsdom<-vitest; minimatch, brace-expansion,
      # flatted, js-yaml, ajv all via eslint; @babel/core). None is actionable
      # from this repo without forcing resolutions that break the toolchain.
      #
      # Gating on these would make the check permanently red for reasons no PR
      # author can fix, which is the fastest way to teach a team to ignore a red
      # security check. Reported to the run summary instead, so the number stays
      # visible and a sudden jump is noticeable.
      #
      # Echoed to stdout as well as the summary, so the job log records what
      # was found rather than only the summary page.
      - name: Full advisories including dev dependencies (advisory only)
        working-directory: frontend
        continue-on-error: true
        run: |
          REPORT="$(pnpm audit --audit-level=moderate 2>&1 | tail -40 || true)"
          echo "${REPORT}"
          {
            echo '## pnpm audit — all dependencies (advisory, not gated)'
            echo
            echo '```'
            echo "${REPORT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Repo root (agent-os-l78). Before this, the root's dependencies
      # (cclsp, playwright — editor/agent tooling and the E2E runner, neither
      # shipped anywhere) lived in an npm package-lock.json that nothing in
      # CI ever read: 11 of the pre-agent-os-l78 Dependabot alerts were
      # against it, invisible to every workflow here. Now pnpm-managed, with
      # its own lockfile, installed with the pnpm pinned above.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING, same gate level as the frontend production step above —
      # but root's package.json declares only `devDependencies`, no
      # `dependencies` at all, so `--prod` has nothing to inspect and this
      # step is a structural no-op today (confirmed: `pnpm audit --prod
      # --audit-level=high` at root reports "No known vulnerabilities
      # found" unconditionally, since there is nothing in scope). Kept
      # anyway rather than left out: it starts protecting automatically,
      # with no further workflow change, the day a real production
      # dependency is added at the root.
      - name: Root production advisories (blocking, high and above)
        run: bash "${GITHUB_WORKSPACE}/scripts/pnpm-audit-retry.sh" --prod --audit-level=high

      # ADVISORY, for the same reason as frontend's dev-dependency step
      # above: everything at the root is dev/editor tooling, none of it
      # ships, and a check that can never go green for a reason a PR author
      # can act on gets ignored rather than fixed. Reported to the summary so
      # the count stays visible and a sudden jump is noticeable.
      - name: Root advisories including dev dependencies (advisory only)
        continue-on-error: true
        run: |
          REPORT="$(pnpm audit --audit-level=moderate 2>&1 | tail -40 || true)"
          echo "${REPORT}"
          {
            echo '## pnpm audit — repo root: cclsp, playwright (advisory, not gated)'
            echo
            echo '```'
            echo "${REPORT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Container image
  # ---------------------------------------------------------------------------
  image-scan:
    # Runner: stays GitHub-hosted. Builds and scans a container image, so it
    # needs a Docker daemon the self-hosted runner does not have (verified
    # 2026-08-07).
    name: Image vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single platform and `load: true` so the image lands in the local daemon
      # for Trivy to scan. The published image is multi-arch (docker-publish.yml),
      # but the OS packages and vendored binaries are the same on both arches, so
      # scanning amd64 covers the same advisory surface at half the build cost.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: capstan:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scan step below is a `uses:` step and cannot be wrapped in a retry,
      # so its one run-time network dependency, the vulnerability DB, is
      # fetched HERE first, by a script that retries only on a recognised
      # registry stall, and the scan then runs with TRIVY_SKIP_DB_UPDATE so it
      # never fetches at all. setup-trivy is the same action, SHA and version
      # that trivy-action@v0.36.0 resolves internally (its action.yaml pins
      # aquasecurity/setup-trivy@3fb12ec1... "v0.2.6" with version v0.70.0),
      # invoked one step earlier: no new third-party code runs in this job.
      # Keep the two versions in lockstep when bumping either. Signatures and
      # sizing are measured and documented in the script header. See
      # agent-os-pvta.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Download Trivy vulnerability DB (retried on registry stall only)
        run: bash "${GITHUB_WORKSPACE}/scripts/trivy-db-retry.sh"
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

      # ADVISORY, and staying that way. This is the only check covering the
      # Debian trixie runtime base, the Docker CLI binaries lifted from
      # docker:29-cli, and the pinned restic 0.19.1 / rclone 1.75.1 static
      # binaries — nothing else in CI looks at any of them at all.
      #
      # THE VULNERABILITY GATE IS NOT GRADUATING. `exit-code: '0'` stays, and
      # so do `severity: HIGH,CRITICAL`, `ignore-unfixed: true` and
      # `scanners: vuln`. Edwin's decision, 2026-09-06 (agent-os-h1hr), taken
      # WITH the baseline in hand rather than for want of one: every remaining
      # finding lives in a third-party binary this repo vendors, so a red gate
      # would block unrelated PRs on an upstream release cadence nobody here
      # controls. The lever is the pin bump, not the exit code.
      #
      # What DOES gate, in a separate step below, is COVERAGE: the scan must
      # still be looking at app/server and at the runtime base's OS packages.
      # See scripts/check-trivy-coverage.sh — a target that silently stops
      # being scanned removes findings and reads as an improvement.
      #
      # `ignore-unfixed: true` on purpose — a finding with no fixed version is
      # not something a PR can act on. It stays out of the report so the report
      # stays worth reading.
      #
      # SUPERSEDED BASELINE, first run 2026-07-31 (alpine 3.21.7): base clean,
      # Capstan binary 1, rclone 39, restic 35 — 8 CRITICAL / 11 HIGH fixable.
      # Kept only so the two baselines can be compared; the image it describes
      # no longer exists. It went stale twice (alpine 3.24, agent-os-4pa.2) and
      # then obsolete entirely when the runtime moved off Alpine.
      #
      # OBSERVED BASELINE, measured 2026-09-06 on branch fix/agent-os-h1hr with
      # trivy 0.70.0 — the version this job installs, so the numbers are
      # comparable to a CI run. Same scoping: HIGH,CRITICAL, ignore-unfixed,
      # scanners vuln. A count is a claim about a SHA and an instrument
      # version; re-measure both before treating a delta as a regression.
      #
      #                                          before   after
      #                                        (bbfeaa2)  (this commit)
      #   capstan:* (debian 13.6)    os-pkgs         0        0   <-- base clean
      #   app/server                 gobinary        0        0   <-- ours clean
      #   usr/local/bin/docker       gobinary        8        0
      #   usr/local/bin/rclone       gobinary       16        0
      #   usr/local/bin/restic       gobinary       14       14
      #   .../cli-plugins/docker-buildx  gobinary   13        1
      #   .../cli-plugins/docker-compose gobinary    4        0
      #                                            ---      ---
      #                                             55       15
      #   of which CRITICAL                          4        1
      #
      # The `before` column is main @ bbfeaa2 (rclone 1.74.4, docker:29-cli
      # @sha256:3f474320). The `after` column is this commit, which bumps
      # rclone to 1.75.1 and the docker:29-cli digest to sha256:eccaacfe.
      #
      # THE ONE REMAINING CRITICAL IS restic, and it cannot be cleared here.
      # CVE-2026-56854 (golang.org/x/crypto/ssh, vendored v0.52.0, fixed in
      # 0.55.0) needs a restic release built against x/crypto >= 0.55.0.
      # restic v0.19.1 IS the newest release (checked 2026-09-06 against the
      # GitHub releases API) and its go.mod:37 pins x/crypto v0.52.0, so there
      # is nothing to bump to. It clears when restic ships v0.19.2 or v0.20.0;
      # bump RESTIC_VER in docker/Dockerfile then. Our own binary is
      # unaffected — backend/go.mod is already on x/crypto v0.55.0.
      #
      # The Docker CLI is three static Go binaries copied from docker:29-cli
      # rather than distro packages, so Trivy resolves their module graphs and
      # reports findings the packaging never surfaced. Nothing in this repo can
      # "fix" one short of an upstream rebuild and a digest bump — which is
      # exactly what took the CLI's three targets from 25 findings to 1.
      #
      # READING THE `Fixed Version` COLUMN: it is the *product* version, which
      # is not always a Go module version. Trivy reports CVE-2026-34040 in
      # github.com/docker/docker as "fixed in 29.3.1", but the Go module has no
      # v29 tag at all — `go list -m -versions github.com/docker/docker` showed
      # v28.5.2+incompatible as newest on 2026-07-31. It reads as actionable and
      # is not. See agent-os-96h before acting on a docker/docker row here.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: capstan:scan
          format: table
          output: trivy.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '0'
          # agent-os-pvta: trivy is installed and its DB downloaded (with
          # retry) by the two steps above. cache:'false' disables the action's
          # own actions/cache restore of the cache dir, which would run AFTER
          # those steps and overwrite the fresh DB with an older day's copy.
          skip-setup-trivy: 'true'
          cache: 'false'
        env:
          # The DB is already in the action's cache dir; never fetch mid-scan.
          TRIVY_SKIP_DB_UPDATE: 'true'

      # The SAME scan again, in JSON, purely so the coverage assertion below has
      # an instrument that lists TARGETS rather than findings.
      #
      # WHY A SECOND SCAN and not a `trivy convert` of one report: convert
      # rebuilds the table from a report whose scanner set it cannot recover,
      # and drops the summary header ("No enabled scanners found. Summary table
      # will not be displayed." — OBSERVED locally with trivy 0.70.0 on
      # 2026-09-06). The table above is what humans read, so it stays produced
      # first-hand and byte-for-byte as before. The image is already local and
      # TRIVY_SKIP_DB_UPDATE keeps this off the network, so the second pass is
      # analysis time only.
      #
      # Scoping is deliberately IDENTICAL to the table scan. If they diverge,
      # the assertion stops describing the report on the summary page.
      - name: Scan image (JSON, for the coverage assertion)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: capstan:scan
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '0'
          skip-setup-trivy: 'true'
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      # An advisory scan nobody reads is theatre. Put the table on the run's
      # summary page so the findings are one click from the check, not four.
      #
      # Also echoed to stdout, deliberately. A step that writes only to
      # GITHUB_STEP_SUMMARY leaves nothing in the job log, and then "the scan
      # found nothing" and "the scan produced nothing" are indistinguishable
      # after the fact. The explicit missing-file branch below exists for the
      # same reason: silence is not success.
      - name: Report findings
        if: always()
        run: |
          if [ ! -f trivy.txt ]; then
            echo "::warning::trivy.txt was not produced — the scan step did not report."
            REPORT='Scan produced no report file. Treat this as a broken scan, not a clean one.'
          elif [ ! -s trivy.txt ]; then
            REPORT='No findings at HIGH/CRITICAL with a fix available.'
          else
            REPORT="$(cat trivy.txt)"
          fi
          echo "${REPORT}"
          {
            echo '## Trivy — image scan (advisory, not gated)'
            echo
            echo 'Covers the debian:trixie-slim runtime base, the Capstan server binary,'
            echo 'the Docker CLI binaries from docker:29-cli, and the vendored restic/rclone binaries.'
            echo 'Unfixed advisories are excluded.'
            echo
            echo '```'
            echo "${REPORT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # THE ONE GATING STEP IN THIS JOB. The scan above is advisory about what
      # it FOUND; this is not advisory about what it LOOKED AT.
      #
      # Trivy's table omits a target that produced no rows, so "app/server is
      # not in the report" is ambiguous between "scanned, clean" and "never
      # scanned". Both readings were live in this repo until 2026-09-06
      # (agent-os-h1hr), and the second one turns a green advisory scan into
      # theatre: a Dockerfile change that stops Trivy resolving the Go binary,
      # or a base image whose package DB it cannot read, REMOVES findings and
      # looks like an improvement.
      #
      # --self-test runs first and on every run, deliberately. A gate only ever
      # observed green has not been shown to be a gate; the self-test drives the
      # assertion red against doctored reports on the same commit the green is
      # claimed on. It needs no network and no image.
      - name: Assert the scan still covers app/server and the OS base
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/check-trivy-coverage.sh" --self-test
          bash "${GITHUB_WORKSPACE}/scripts/check-trivy-coverage.sh" trivy.json
