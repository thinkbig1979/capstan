# Backend CI — build, vet, and unit tests. No Docker, no network beyond the
# module proxy.
#
# WHY THIS EXISTS SEPARATELY FROM integration.yml:
#   The backend unit suite used to run only as the last step of the
#   real-Docker integration job. That made the fastest, most reliable signal
#   in the pipeline depend on the slowest, most environment-sensitive one: a
#   Docker Hub outage, a rate limit, or a runner image change failed the job
#   before the unit tests ever ran. The result was an *absent* signal rather
#   than a red one, which is the dangerous failure mode — a PR that would have
#   failed unit tests can merge on a check that never executed.
#
#   This workflow needs no Docker daemon and no registry access, so it stays
#   green (or goes honestly red) independently of integration.yml. That also
#   makes it the only place a self-contained `//go:build integration` test can
#   be caught leaking into the default build: such a test compiles and vets
#   cleanly, and passes on the Docker-equipped integration runner. It fails
#   here, where there is no daemon.
#
# NO BASE-BRANCH FILTER:
#   integration.yml filters `pull_request` on `branches: [main, 'feat/**']`,
#   which is a filter on the *base* branch. A stacked PR (feature onto
#   feature) or any base outside that set silently skips the job. Unit tests
#   must run on every PR that touches backend code, so this workflow does not
#   filter on the base branch.
#
# NO PATH FILTER EITHER, SINCE agent-os-x8n:
#   The jobs here are required status checks on main (or are meant to become
#   one — see the lint job below). A workflow-level `paths:` filter does not
#   make a required check pass on an unrelated PR — it makes the check never
#   report at all, so the PR sits on "Expected — waiting for status" and can
#   never merge. That is a merge deadlock on every docs-only or
#   frontend-only PR, which is why the filters were removed rather than
#   kept. The lint job added by agent-os-far follows the same reasoning:
#   "runs on PRs touching backend/**" is satisfied by running on all PRs,
#   which is a superset, without the deadlock risk a literal `paths:` filter
#   would carry as a required check.
#
#   The alternative was a change-detection job fanning out to `if:`-gated jobs
#   (skipped jobs DO report a conclusion and so satisfy a required check).
#   That was rejected as more machinery than the cost it saves: this whole
#   workflow needs no Docker and no registry, and runs in ~1-2 minutes. Paying
#   that on a README-only PR is cheaper than maintaining a second mechanism
#   whose failure mode is a silent unprotected merge.
#
#   The paths that used to be listed here — 'backend/**', 'docker/Dockerfile',
#   '.github/workflows/backend.yml' — are now a subset of "everything", so the
#   Dockerfile/go.mod lockstep this filter was protecting is still covered.

name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  # Allow manual one-off runs from the Actions tab.
  workflow_dispatch:

jobs:
  unit:
    name: Build, vet, and unit tests
    runs-on: ubuntu-latest
    # The suite takes well under a minute; this is a hang guard, not a budget.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go-version-file reads backend/go.mod, and from v6 setup-go prefers its
      # `toolchain` directive over the `go` directive — so CI installs exactly
      # the toolchain the code is pinned to. The v6 pin is load-bearing: v5
      # reads only the `go` directive, and go.mod carries both `go 1.25.0` and
      # `toolchain go1.25.12`.
      #
      # This replaces a `grep '^go ' backend/go.mod` step that matched that
      # same wrong line. CI installed 1.25.0 and reached the pinned toolchain
      # only because GOTOOLCHAIN defaults to `auto`, which makes the go command
      # silently re-exec into the right version. That worked, but nothing
      # expressed it and nothing enforced it — GOTOOLCHAIN=local anywhere would
      # have reverted CI to the older stdlib with no failing check.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Record the toolchain that actually compiles. Keep this even though the
      # setup step now resolves correctly: it is the only line in the log that
      # states what compiled rather than what was requested, and it is what
      # caught the v5 behaviour above.
      - name: Report Go version
        working-directory: backend
        run: go version

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # -count=1 disables the test cache, so a green run always reflects this
      # commit rather than a cached result from an earlier one.
      - name: Unit tests
        working-directory: backend
        run: go test ./... -count=1

  # This codebase is the profile the race detector is built for:
  # goroutine-per-connection WebSocket handlers, background tickers, a session
  # map behind a mutex, a connection manager behind an RWMutex.
  #
  # It runs on every PR, in its own job. Measured on this repo's runners the
  # -race step takes ~100s against ~25s without, and the job as a whole ~2min
  # against the unit job's ~40s. Because the two run concurrently, and because
  # integration.yml takes ~4.5min on the same PR, that puts the race detector
  # nowhere near the critical path — so there is no reason to defer it to a
  # nightly and learn about a race up to a day after the commit that caused it.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Report Go version
        working-directory: backend
        run: go version

      - name: Unit tests with -race
        working-directory: backend
        run: go test ./... -count=1 -race

  # golangci-lint (agent-os-far). Its own job, not folded into `unit`: a
  # failing build/vet/test signal and a failing lint signal are different
  # kinds of red, and splitting them means a PR that only trips lint doesn't
  # block on re-running the whole unit job to see if the fix worked. Needs no
  # Docker daemon or registry access, same as the rest of this workflow —
  # deliberately not added to integration.yml (see the file header).
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Pin the golangci-lint version so a new release can't turn `main` red
      # without a code change — the same reasoning as the pnpm 11.5.1 pin in
      # frontend.yml. Matches the version installed and verified locally
      # (2.12.2); bump both together. The action itself is SHA-pinned, same
      # convention as react-doctor.yml's millionco/react-doctor pin.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: backend
