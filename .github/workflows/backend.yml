# Backend CI — build, vet, and unit tests. No Docker, no network beyond the
# module proxy.
#
# WHY THIS EXISTS SEPARATELY FROM integration.yml:
#   The backend unit suite used to run only as the last step of the
#   real-Docker integration job. That made the fastest, most reliable signal
#   in the pipeline depend on the slowest, most environment-sensitive one: a
#   Docker Hub outage, a rate limit, or a runner image change failed the job
#   before the unit tests ever ran. The result was an *absent* signal rather
#   than a red one, which is the dangerous failure mode — a PR that would have
#   failed unit tests can merge on a check that never executed.
#
#   This workflow needs no Docker daemon and no registry access, so it stays
#   green (or goes honestly red) independently of integration.yml. That also
#   makes it the only place a self-contained `//go:build integration` test can
#   be caught leaking into the default build: such a test compiles and vets
#   cleanly, and passes on the Docker-equipped integration runner. It fails
#   here, where there is no daemon.
#
# NO BASE-BRANCH FILTER:
#   integration.yml filters `pull_request` on `branches: [main, 'feat/**']`,
#   which is a filter on the *base* branch. A stacked PR (feature onto
#   feature) or any base outside that set silently skips the job. Unit tests
#   must run on every PR that touches backend code, so this workflow does not
#   filter on the base branch.
#
# NO PATH FILTER EITHER, SINCE agent-os-x8n:
#   The jobs here are required status checks on main (or are meant to become
#   one — see the lint job below). A workflow-level `paths:` filter does not
#   make a required check pass on an unrelated PR — it makes the check never
#   report at all, so the PR sits on "Expected — waiting for status" and can
#   never merge. That is a merge deadlock on every docs-only or
#   frontend-only PR, which is why the filters were removed rather than
#   kept. The lint job added by agent-os-far follows the same reasoning:
#   "runs on PRs touching backend/**" is satisfied by running on all PRs,
#   which is a superset, without the deadlock risk a literal `paths:` filter
#   would carry as a required check.
#
#   The alternative was a change-detection job fanning out to `if:`-gated jobs
#   (skipped jobs DO report a conclusion and so satisfy a required check).
#   That was rejected as more machinery than the cost it saves: this whole
#   workflow needs no Docker and no registry, and runs in ~1-2 minutes. Paying
#   that on a README-only PR is cheaper than maintaining a second mechanism
#   whose failure mode is a silent unprotected merge.
#
#   The paths that used to be listed here — 'backend/**', 'docker/Dockerfile',
#   '.github/workflows/backend.yml' — are now a subset of "everything", so the
#   Dockerfile/go.mod lockstep this filter was protecting is still covered.

name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  # Allow manual one-off runs from the Actions tab.
  workflow_dispatch:

jobs:
  unit:
    name: Build, vet, and unit tests
    # Runner: self-hosted by default, EXCEPT for pull requests from forks.
    # This repo is public with forking enabled, so a fork PR running on our own
    # hardware would be arbitrary code execution on the runner host. Falling
    # back to a disposable GitHub-hosted VM for fork PRs keeps that code off our
    # box while still reporting the check — which matters because several of
    # these are required by branch protection, and a skipped required check
    # blocks a PR forever rather than failing it honestly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    # The suite takes well under a minute; this is a hang guard, not a budget.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go-version-file reads backend/go.mod, and from v6 setup-go prefers its
      # `toolchain` directive over the `go` directive — so CI installs exactly
      # the toolchain the code is pinned to. The v6 pin is load-bearing: v5
      # reads only the `go` directive, and go.mod carries both `go 1.25.0` and
      # `toolchain go1.25.12`.
      #
      # This replaces a `grep '^go ' backend/go.mod` step that matched that
      # same wrong line. CI installed 1.25.0 and reached the pinned toolchain
      # only because GOTOOLCHAIN defaults to `auto`, which makes the go command
      # silently re-exec into the right version. That worked, but nothing
      # expressed it and nothing enforced it — GOTOOLCHAIN=local anywhere would
      # have reverted CI to the older stdlib with no failing check.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Record the toolchain that actually compiles. Keep this even though the
      # setup step now resolves correctly: it is the only line in the log that
      # states what compiled rather than what was requested, and it is what
      # caught the v5 behaviour above.
      - name: Report Go version
        working-directory: backend
        run: go version

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Build-tagged files are invisible to the step above, so a tag nothing
      # compiles rots silently: `manualremote` accumulated a duplicate runGit
      # declaration and `go vet -tags=manualremote` had never once compiled
      # (agent-os-e11e). This is a TYPE-CHECK, not a test run -- vet does not
      # execute anything, and TestManualRemote must never run here because it
      # clones github.com/thinkbig1979/capstan over the real network on both
      # HTTPS and SSH. Do not "simplify" this away; it is the only thing
      # standing between that tag and the next silent rot.
      - name: Vet (build-tagged files)
        working-directory: backend
        run: go vet -tags=manualremote ./...

      # -count=1 disables the test cache, so a green run always reflects this
      # commit rather than a cached result from an earlier one.
      - name: Unit tests
        working-directory: backend
        run: go test ./... -count=1

      # The getter-errors ANALYZER (agent-os-qyg7.2), replacing the count
      # ratchet that stood here. The ratchet enforced a per-file baseline, so
      # deleting one site and adding another in the same file netted zero and
      # passed; the analyzer reports ZERO on the tree, so any new site is a
      # hard failure in this required job.
      #
      # It detects an error softened into an "absent" signal (`x, e := f()`
      # read only as `e == nil`) and one merged into a value test
      # (`if e != nil || v`), by SHAPE and by TYPE -- never by the error's
      # name, the callee's verb or the receiver expression, every one of which
      # has already returned a false zero on this tree. DISCARD
      # (`x, _ := f()`) is not here: errcheck with check-blank owns it as of
      # agent-os-qyg7.1, in the required "Lint (golangci-lint)" job.
      #
      # WHY -C, and it is not cosmetic: backend/tools/geterrors has its OWN
      # go.mod, which is what keeps golang.org/x/tools out of backend's
      # dependency graph. Without -C this exits 1 with "main module does not
      # contain package". That nesting also means the step above's
      # `go build ./...` and `go vet ./...` never see the analyzer, so it gets
      # its own build and its own test run here.
      #
      # THE TEST RUN IS NOT OPTIONAL and it runs FIRST, mirroring the
      # --self-test the deleted script ran before every verdict. A detector
      # that has silently stopped firing looks exactly like a clean tree, and
      # this step's green is what a close reason will cite. The analysistest
      # suite is two-sided: a fixture that must report every planted site by
      # line, and fixtures that must stay silent.
      #
      # AFTER the unit tests, not before: a step that fails stops the job, so
      # running a policy gate first would hide a genuine test failure behind
      # it. Runner time is not the constraint here (self-hosted); information
      # per run is.
      - name: Getter-errors analyzer
        working-directory: backend
        run: |
          go test -C tools/geterrors ./... -count=1
          go build -C tools/geterrors -o "$RUNNER_TEMP/geterrors" ./cmd/geterrors
          go vet -vettool="$RUNNER_TEMP/geterrors" ./...

      # The frontend's wire types are generated from the Go structs that serve
      # them (backend/tygo.yaml), so a Go field that changes without its
      # TypeScript is a contract break the browser discovers at runtime. This
      # step regenerates and fails if the result differs from what is committed.
      #
      # It lives HERE, in a required job, rather than in a job of its own: a new
      # job would not be a required check, so it would report the drift without
      # ever blocking it. frontend.yml cannot host it either — that job sets up
      # no Go toolchain.
      #
      # `git -C ..` is load-bearing. working-directory puts this step in
      # backend/, and a repo-root pathspec evaluated from there is an "ambiguous
      # argument" — git exits 128, which is not 0, so the step would appear to
      # pass its own failure. -C returns to the repo root so the pathspec
      # resolves and a real difference exits 1.
      #
      # `add --intent-to-add` is load-bearing for a different reason, and it was
      # found by running this step against a tree that did not have the
      # generated files: `git diff` does not see UNTRACKED files, so if the two
      # outputs are missing from the repo entirely, tygo recreates them and the
      # diff is empty — the step exits 0 and reports green over a contract that
      # is not committed at all. --intent-to-add registers them so a
      # never-committed file reads as a difference rather than as absence.
      #
      # go run pkg@version needs no go.mod entry and there is no backend/vendor,
      # so this pins tygo without touching the module graph.
      - name: Generated wire types are current
        working-directory: backend
        run: |
          go run github.com/gzuidhof/tygo@v0.2.21 generate
          git -C .. add --intent-to-add frontend/src/types/generated.ts frontend/src/types/generated-truth.ts
          git -C .. diff --exit-code -- frontend/src/types/generated.ts frontend/src/types/generated-truth.ts

  # This codebase is the profile the race detector is built for:
  # goroutine-per-connection WebSocket handlers, background tickers, a session
  # map behind a mutex, a connection manager behind an RWMutex.
  #
  # It runs on every PR, in its own job. Measured on this repo's runners the
  # -race step takes ~100s against ~25s without, and the job as a whole ~2min
  # against the unit job's ~40s. Because the two run concurrently, and because
  # integration.yml takes ~4.5min on the same PR, that puts the race detector
  # nowhere near the critical path — so there is no reason to defer it to a
  # nightly and learn about a race up to a day after the commit that caused it.
  race:
    name: Race detector
    # Runner: self-hosted by default, EXCEPT for pull requests from forks.
    # This repo is public with forking enabled, so a fork PR running on our own
    # hardware would be arbitrary code execution on the runner host. Falling
    # back to a disposable GitHub-hosted VM for fork PRs keeps that code off our
    # box while still reporting the check — which matters because several of
    # these are required by branch protection, and a skipped required check
    # blocks a PR forever rather than failing it honestly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Report Go version
        working-directory: backend
        run: go version

      - name: Unit tests with -race
        working-directory: backend
        run: go test ./... -count=1 -race

  # golangci-lint (agent-os-far). Its own job, not folded into `unit`: a
  # failing build/vet/test signal and a failing lint signal are different
  # kinds of red, and splitting them means a PR that only trips lint doesn't
  # block on re-running the whole unit job to see if the fix worked. Needs no
  # Docker daemon or registry access, same as the rest of this workflow —
  # deliberately not added to integration.yml (see the file header).
  lint:
    name: Lint (golangci-lint)
    # Runner: self-hosted by default, EXCEPT for pull requests from forks.
    # This repo is public with forking enabled, so a fork PR running on our own
    # hardware would be arbitrary code execution on the runner host. Falling
    # back to a disposable GitHub-hosted VM for fork PRs keeps that code off our
    # box while still reporting the check — which matters because several of
    # these are required by branch protection, and a skipped required check
    # blocks a PR forever rather than failing it honestly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Pin the golangci-lint version so a new release can't turn `main` red
      # without a code change — the same reasoning as the pnpm 11.5.1 pin in
      # frontend.yml. The action itself is SHA-pinned, same convention as
      # react-doctor.yml's millionco/react-doctor pin.
      #
      # Verified locally on 2026-08-08 via `golangci-lint --version`: reports
      # 2.12.2, matching the pin below, and `golangci-lint run ./...` in
      # backend/ exits 0. This claim goes stale the moment either binary or
      # pin changes — re-run both commands yourself before trusting it;
      # don't assume it still holds.
      #
      # A bare `go install .../golangci-lint@v2.12.2` is NOT enough to
      # reproduce this: it builds against whatever Go toolchain is your
      # shell default, and if that's older than backend/go.mod's `toolchain`
      # directive, the resulting binary refuses to run here with "the Go
      # language version used to build golangci-lint is lower than the
      # targeted Go version" — an error that names a Go version, not the
      # pin, so it doesn't read as an install problem. Force the build
      # toolchain instead: `GOTOOLCHAIN=go1.26.5 go install .../golangci-lint@v2.12.2`
      # (match whatever `toolchain` line backend/go.mod currently declares).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: backend
