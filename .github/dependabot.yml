# Dependabot — automated dependency updates.
#
# WHY THIS EXISTS ALONGSIDE .github/workflows/security.yml:
#   The scan raises the alarm; this supplies the fix. Either one alone fails in
#   a predictable way. A gate with no repair path leaves main red until people
#   learn to route around it. A repair path with no gate produces PRs nobody
#   has a reason to merge. They were added together on purpose.
#
# EVERY TREE THIS REPO ACTUALLY HAS — four ecosystems across five entries:
#   gomod (/backend), npm (/frontend), npm (/), docker (/docker),
#   github-actions (/).
#   github-actions is the easy one to forget and is how pinned action versions
#   rot quietly — nothing else in this repo would ever notice.
#   npm at `/` is the SECOND npm tree, added 2026-08-08 (agent-os-81i). The repo
#   root is a real pnpm project, not scratch, and it was previously the one tree
#   CI installed and gated on that nothing would ever propose an update to.
#
# GROUPING:
#   Minor and patch updates are grouped per ecosystem into a single PR, so the
#   volume stays reviewable. Majors stay ungrouped and arrive one at a time,
#   because a major is a judgement call and does not belong in a batch that
#   gets approved on the strength of the other five entries.
#
# Schedules are spread across the week rather than all landing Monday, so a
# quiet week produces four small PRs on four days instead of one wall.

version: 2

updates:
  # ---------------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # COOLDOWN IS LOAD-BEARING HERE, unlike the other three ecosystems.
  #
  # frontend/pnpm-workspace.yaml sets `minimumReleaseAge: 10080` (7 days): pnpm
  # refuses to resolve any version published more recently than that. It is a
  # deliberate supply-chain control and it already blocked two upgrades during
  # session 2.
  #
  # Dependabot does its own resolution and does not know about that setting, so
  # without a matching cooldown it would happily open a PR for a release
  # published hours ago — a version pnpm itself would refuse. The cooldown below
  # aligns the two windows so Dependabot only proposes versions pnpm will accept.
  #
  # VERIFIED 2026-07-31, on Dependabot PR #22 (the npm minor+patch group, 36
  # updates): frontend CI's `pnpm install --frozen-lockfile`
  # (.github/workflows/frontend.yml:51) succeeded against a Dependabot-generated
  # lockfile. The two controls do not conflict.
  #
  # CORRECTED 2026-08-08 (agent-os-81i). That paragraph used to explain the
  # success with "a frozen install replays the lockfile rather than resolving,
  # so the quarantine never applies to it". THAT EXPLANATION IS FALSE under pnpm
  # 11.5.1, and it is the load-bearing half — the observation stands, the reason
  # given for it does not. A frozen install runs the supply-chain verification
  # pass over the lockfile's entries BEFORE installing anything, and rejects the
  # committed lockfile itself if an entry is too young. OBSERVED 2026-08-08,
  # twice: agent-os-eki hit exactly this at the repo root, and it was reproduced
  # here on a lockfile carrying jose@6.2.7 —
  # `pnpm install --frozen-lockfile` exited 1 with
  # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION and node_modules absent.
  #
  # So the cooldown is not belt-and-braces, it is the ONLY thing keeping
  # Dependabot's PRs green. PR #22 passed because the cooldown had already kept
  # every proposed version at least 7 days old, not because frozen installs are
  # immune. Removing a cooldown from any pnpm ecosystem entry here turns
  # Dependabot into a generator of red required checks.
  #
  # That PR did fail overall, on Lint, because a new rule shipped by one of the
  # updated dev dependencies flagged pre-existing code. That is an ordinary
  # consequence of updating, not a supply-chain-control interaction — worth
  # stating so the failure is not later misread as evidence against the cooldown.
  #
  # The cooldown above stays regardless: it keeps Dependabot from proposing a
  # version pnpm would refuse on any path that *does* resolve. If a
  # fresh-resolution path ever trips the quarantine, widen the cooldown rather
  # than weaken minimumReleaseAge.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Covers the Dockerfile's pinned bases: node:22-trixie-slim,
  # golang:1.26.5-trixie, debian:trixie-slim, and the digest-pinned docker:29-cli
  # stage the runtime lifts the Docker CLI binaries out of.
  #
  # NOTE for reviewers of these PRs: the Go base image is pinned in lockstep with
  # backend/go.mod's `toolchain` directive. Dependabot updates the Dockerfile
  # only and cannot know about that relationship, so a golang:* bump here must be
  # paired with the matching go.mod change or CI and the shipped image compile
  # against different standard libraries. backend.yml deliberately triggers on
  # docker/Dockerfile so this drift is at least visible.
  #
  # The restic and rclone binaries are fetched by URL with pinned SHA256 sums,
  # not by image reference, so Dependabot cannot see them. Trivy's scan of the
  # built image is what covers those.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: wednesday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
    # Node major bumps are ignored because this repo tracks Node LTS
    # deliberately, in three places that must agree: docker/Dockerfile's
    # frontend-build stage, frontend.yml's `node-version: 22`, and the "Node
    # Version: 22 LTS" standard in CLAUDE.md. Dependabot's first run proposed
    # node:22-alpine -> node:25-alpine (PR #14), which is an odd-numbered, i.e.
    # non-LTS, line — and it would have moved one of those three without the
    # other two. The base has since moved to node:22-trixie-slim; the reasoning
    # is unchanged.
    #
    # This encodes the existing policy rather than setting a new one. Moving to
    # the next LTS is a deliberate change across all three files, not a bot PR.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # ---------------------------------------------------------------------------
  # THE REPO ROOT pnpm TREE (agent-os-81i). Added 2026-08-08; before that, this
  # tree was the one thing CI installed and gated on that no automation would
  # ever update.
  #
  # It is a real tree, not scratch: package.json + pnpm-lock.yaml holding cclsp
  # and playwright, installed with `pnpm install --frozen-lockfile` in three CI
  # places (security.yml's "Install root dependencies", and e2e-backup.yml's two
  # "Install root dependencies (Playwright)" steps). security.yml also runs
  # `pnpm audit --prod --audit-level=high` here as a BLOCKING step.
  #
  # The gap was inherited from agent-os-l78, which brought the root under pnpm
  # because "11 of the pre-l78 Dependabot alerts were against it, invisible to
  # every workflow here" — the workflow half was fixed and the Dependabot half
  # was not.
  #
  # COOLDOWN IS LOAD-BEARING HERE for the same reason as /frontend, and the root
  # tree carries the same `minimumReleaseAge: 10080` since agent-os-eki. See the
  # correction in the /frontend block above: a frozen install does NOT bypass
  # the quarantine, so without this cooldown Dependabot would open PRs whose
  # lockfiles CI then refuses to install.
  #
  # WHAT IS NOT YET VERIFIED, stated plainly rather than assumed: whether
  # Dependabot's own re-resolution actually satisfies the floor in practice
  # cannot be observed until its first run against this entry (Friday 05:00
  # UTC). The mechanism argument is that a 7-day cooldown and a 7-day
  # minimumReleaseAge define the same window, which is exactly the alignment
  # that has held for /frontend since 2026-07-31. If a root PR does arrive red
  # with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION, widen this cooldown — do not
  # weaken minimumReleaseAge, and do not add an exclusion entry.
  #
  # Friday, because Mon/Tue/Wed/Thu are taken and the point of spreading them is
  # that a quiet week produces small PRs on separate days rather than one wall.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      root-npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Directory is `/` — Dependabot finds .github/workflows/ from the repo root,
  # not from .github/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
