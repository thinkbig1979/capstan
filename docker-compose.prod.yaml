services:
  app:
    container_name: capstan
    image: capstan:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./stacks:/opt/stacks
      - ./data:/app/data
      - ./keys:/app/keys:ro
    env_file:
      - .env
    networks:
      - capstan-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

networks:
  capstan-network:
    external: true
