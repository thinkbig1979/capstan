services:
  app:
    container_name: capstan
    # Published by .github/workflows/docker-publish.yml. Pin to a version tag
    # (e.g. :0.9.0) in production; :latest tracks the most recent release.
    # The default stays :latest deliberately — a pinned tag in a template file
    # goes stale on every release and nothing in the repo keeps it current. Since
    # :latest is mutable and the watchtower label below lets an agent move it,
    # identify what is actually running with `curl localhost:5001/api/v1/version`
    # or Settings → About.
    image: ghcr.io/thinkbig1979/capstan:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      # Capstan joins the socket's group at runtime; no host changes needed.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./stacks:/opt/stacks
      # ./data is a host bind mount — the restic backup repository lives at
      # ./data/restic-repo (container path /app/data/restic-repo) by default.
      # Snapshots survive container recreation as long as this directory exists.
      - ./data:/app/data
      - ./keys:/app/keys:ro
    environment:
      # Match the host user that owns your stacks/data (default 1000).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # JWT_SECRET (required) and STORAGE_KEY (recommended) are read from .env
      # below — generate each with `openssl rand -hex 32`. See README / Deployment
      # Guide. STORAGE_KEY encrypts stored secrets at rest independently of
      # JWT_SECRET; it falls back to JWT_SECRET if unset.
      # Backup — optional env-var fallbacks; DB settings (Settings → Backup) take
      # precedence at runtime. Set these if you prefer environment-level config
      # over the UI, or for scripted/headless deployments.
      # - RESTIC_REPOSITORY=/app/data/restic-repo
      # - RESTIC_PASSWORD=change-me
      # - RCLONE_REMOTE=myremote
      # - RCLONE_PATH=capstan-backups
    env_file:
      - .env
    networks:
      - capstan-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

networks:
  capstan-network:
    external: true
